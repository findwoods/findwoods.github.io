name: One-shot Actions artifact cleanup

on:
  push:
    paths:
      - ".github/workflows/cleanup-actions-artifacts.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete all repository Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while true; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")"
            ids="$(printf '%s' "$response" | jq -r '.artifacts[].id')"
            if [ -z "$ids" ]; then
              break
            fi
            for id in $ids; do
              curl --fail-with-body --silent --show-error \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              deleted=$((deleted + 1))
            done
          done
          printf 'deleted_artifacts=%s\ncompleted_at=%s\n' "$deleted" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/actions-artifact-cleanup-result.txt
          echo "Deleted ${deleted} Actions artifact(s)."

      - name: Record cleanup result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions-artifact-cleanup-result.txt
          git commit -m "ops: record Actions artifact cleanup result"
          git push
