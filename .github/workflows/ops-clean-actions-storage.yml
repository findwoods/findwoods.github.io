name: One-shot Actions storage cleanup

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  cleanup:
    if: github.event.issue.title == 'ops: cleanup actions storage'
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts and caches, then report
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function listArtifacts() {
              const all = [];
              for (let page = 1; ; page++) {
                const r = await github.request('GET /repos/{owner}/{repo}/actions/artifacts', {owner, repo, per_page: 100, page});
                all.push(...r.data.artifacts);
                if (r.data.artifacts.length < 100) break;
              }
              return all;
            }

            async function listCaches() {
              const all = [];
              for (let page = 1; ; page++) {
                const r = await github.request('GET /repos/{owner}/{repo}/actions/caches', {owner, repo, per_page: 100, page});
                all.push(...r.data.actions_caches);
                if (r.data.actions_caches.length < 100) break;
              }
              return all;
            }

            const artifactsBefore = await listArtifacts();
            const cachesBefore = await listCaches();
            const artifactBytesBefore = artifactsBefore.reduce((n, x) => n + (x.size_in_bytes || 0), 0);
            const cacheBytesBefore = cachesBefore.reduce((n, x) => n + (x.size_in_bytes || 0), 0);

            for (const a of artifactsBefore) {
              await github.request('DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {owner, repo, artifact_id: a.id});
            }
            for (const c of cachesBefore) {
              await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {owner, repo, cache_id: c.id});
            }

            const artifactsAfter = await listArtifacts();
            const cachesAfter = await listCaches();
            const artifactBytesAfter = artifactsAfter.reduce((n, x) => n + (x.size_in_bytes || 0), 0);
            const cacheBytesAfter = cachesAfter.reduce((n, x) => n + (x.size_in_bytes || 0), 0);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: [
                'ACTIONS_STORAGE_CLEANUP_COMPLETE',
                `artifacts_deleted=${artifactsBefore.length}`,
                `artifact_bytes_before=${artifactBytesBefore}`,
                `artifact_bytes_after=${artifactBytesAfter}`,
                `caches_deleted=${cachesBefore.length}`,
                `cache_bytes_before=${cacheBytesBefore}`,
                `cache_bytes_after=${cacheBytesAfter}`
              ].join('\n')
            });
