name: Temporary translation model package

on:
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: write

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow run ID
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `helsinki-translation-model-run-id: ${context.runId}`
            })
      - name: Install converters
        run: pip install --quiet 'transformers[torch]' sentencepiece ctranslate2
      - name: Download and convert model
        run: |
          python - <<'PY'
          from transformers import MarianMTModel, MarianTokenizer
          name = 'Helsinki-NLP/opus-mt-en-zh'
          out = 'teacher-en-zh-hf'
          MarianMTModel.from_pretrained(name).save_pretrained(out)
          MarianTokenizer.from_pretrained(name).save_pretrained(out)
          PY
          ct2-transformers-converter --model teacher-en-zh-hf --output_dir teacher-en-zh-ct2-int8 --quantization int8 --force
          ls -lh teacher-en-zh-ct2-int8
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: helsinki-english-chinese-ct2-model
          path: teacher-en-zh-ct2-int8
          compression-level: 0
          retention-days: 1
