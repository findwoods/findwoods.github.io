name: Temporary translation model package

on:
  pull_request:
    branches:
      - main

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download public model repository
        run: |
          git clone --depth 1 https://github.com/zhangrr/distill-opus-mt-en-zh.git model-repo
          mkdir -p translation-model
          cp -a model-repo/outputs/opus-mt-small320d-opus100-joint32k-ft-money-coffee-ct2-int8/. translation-model/
          ls -lh translation-model
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: english-chinese-ct2-model
          path: translation-model
          compression-level: 0
          retention-days: 1
