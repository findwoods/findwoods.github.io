name: Temporary translation model package

on:
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: write

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download public model repository
        run: |
          git clone --depth 1 https://github.com/zhangrr/distill-opus-mt-en-zh.git model-repo
          mkdir -p translation-model
          cp -a model-repo/outputs/opus-mt-small320d-opus100-joint32k-ft-money-coffee-ct2-int8/. translation-model/
          ls -lh translation-model
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: english-chinese-ct2-model
          path: translation-model
          compression-level: 0
          retention-days: 1
      - name: Report workflow run ID
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `translation-model-run-id: ${context.runId}`
            })
