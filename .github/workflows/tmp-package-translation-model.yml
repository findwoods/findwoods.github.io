name: Temporary translation model package

on:
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: write

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow run ID
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `argos-translation-model-run-id: ${context.runId}`
            })
      - name: Download full English-Chinese model
        run: |
          curl -L --fail --retry 3 \
            https://data.argosopentech.com/argospm/v1/translate-en_zh-1_9.argosmodel \
            -o translate-en_zh-1_9.argosmodel
          ls -lh translate-en_zh-1_9.argosmodel
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: argos-english-chinese-model
          path: translate-en_zh-1_9.argosmodel
          compression-level: 0
          retention-days: 1
