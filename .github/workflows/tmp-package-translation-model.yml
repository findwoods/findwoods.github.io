name: Temporary translation model package

on:
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: write

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow run ID
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `nllb-complete-model-run-id: ${context.runId}`
            })
      - name: Install converters
        run: pip install --quiet 'transformers[torch]' sentencepiece ctranslate2
      - name: Download and convert model
        run: |
          python - <<'PY'
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer
          name = 'facebook/nllb-200-distilled-600M'
          out = 'nllb-hf'
          AutoModelForSeq2SeqLM.from_pretrained(name).save_pretrained(out)
          AutoTokenizer.from_pretrained(name, use_fast=False).save_pretrained(out)
          PY
          find nllb-hf -maxdepth 1 -type f -printf '%f %s\n' | sort
          ct2-transformers-converter --model nllb-hf --output_dir nllb-ct2-int8 --quantization int8 --force
          find nllb-hf -maxdepth 1 -type f -name '*.model' -exec cp -a {} nllb-ct2-int8/ \;
          cp -a nllb-hf/tokenizer_config.json nllb-ct2-int8/
          cp -a nllb-hf/special_tokens_map.json nllb-ct2-int8/ || true
          ls -lh nllb-ct2-int8
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: nllb-english-chinese-ct2-model-complete
          path: nllb-ct2-int8
          compression-level: 0
          retention-days: 1
