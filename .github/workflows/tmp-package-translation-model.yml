name: Temporary translation tokenizer package

on:
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: write

jobs:
  package-tokenizer:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow run ID
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `nllb-tokenizer-run-id: ${context.runId}`
            })
      - name: Download tokenizer
        run: |
          curl -L --fail --retry 3 \
            'https://huggingface.co/facebook/nllb-200-distilled-600M/resolve/main/sentencepiece.bpe.model?download=true' \
            -o sentencepiece.bpe.model
          sha256sum sentencepiece.bpe.model
          ls -lh sentencepiece.bpe.model
      - name: Upload tokenizer
        uses: actions/upload-artifact@v4
        with:
          name: nllb-sentencepiece-tokenizer
          path: sentencepiece.bpe.model
          compression-level: 0
          retention-days: 1
