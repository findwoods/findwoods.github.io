name: Temporary mBART translation model package

on:
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: write

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow run ID
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `mbart-split-model-v2-run-id: ${context.runId}`
            })
      - name: Install converters
        run: pip install --quiet 'transformers[torch]<5' sentencepiece ctranslate2 protobuf
      - name: Download, convert, and split model
        run: |
          python - <<'PY'
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer
          name = 'facebook/mbart-large-50-many-to-many-mmt'
          out = 'mbart-hf'
          AutoModelForSeq2SeqLM.from_pretrained(name).save_pretrained(out)
          AutoTokenizer.from_pretrained(name, use_fast=False).save_pretrained(out)
          PY
          ct2-transformers-converter --model mbart-hf --output_dir mbart-ct2-int8 --quantization int8 --force
          find mbart-hf -maxdepth 1 -type f \( -name '*.model' -o -name 'tokenizer_config.json' -o -name 'special_tokens_map.json' -o -name 'sentencepiece.bpe.model' \) -exec cp -a {} mbart-ct2-int8/ \;
          tar -cf mbart-model.tar mbart-ct2-int8
          split -b 350M -d -a 2 mbart-model.tar mbart-model.tar.part-
          ls -lh mbart-model.tar.part-*
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: mbart-model-v2-part-00
          path: mbart-model.tar.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: mbart-model-v2-part-01
          path: mbart-model.tar.part-01
          compression-level: 0
          retention-days: 1
