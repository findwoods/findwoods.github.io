<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目I.4 - 简单结构推断</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h2::before {
            content: '🔬';
            font-size: 1.5rem;
        }

        .explanation {
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .svg-container {
            background: #0a0a1a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .highlight {
            color: var(--accent);
            font-weight: bold;
        }

        .answer-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(99, 102, 241, 0.2));
            border: 2px solid var(--accent);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .answer-box h3 {
            color: var(--accent);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 题目 I.4 - 简单结构推断</h1>

        <div class="card">
            <h2>题目概述</h2>
            <p>推断分子式为 <span class="highlight">C₄H₉I</span> 的化合物结构。</p>
            <div class="explanation">
                <strong>NMR数据：</strong><br>
                • 1.03 δ, Doublet, 6H<br>
                • 1.72 δ, Nonet (九重峰), 1H<br>
                • 3.16 δ, Doublet, 2H
            </div>
        </div>

        <!-- 工具1: NMR数据分析 -->
        <div class="card">
            <h2>工具1: NMR数据逐条分析</h2>
            <div class="svg-container">
                <svg id="svg-nmr4" width="700" height="350" viewBox="0 0 700 350">
                    <!-- 信号1: 6H doublet -->
                    <g id="nmr4-step1" opacity="0">
                        <rect x="30" y="30" width="200" height="90" rx="10" fill="rgba(16, 185, 129, 0.2)"
                            stroke="#10b981" stroke-width="2" />
                        <text x="130" y="55" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">1.03
                            δ, Doublet, 6H</text>
                        <text x="130" y="80" text-anchor="middle" fill="#f1f5f9" font-size="12">6H doublet = 异丙基!</text>
                        <text x="130" y="100" text-anchor="middle" fill="#f59e0b" font-size="12">-CH(CH₃)₂</text>
                    </g>

                    <!-- 信号2: 1H nonet -->
                    <g id="nmr4-step2" opacity="0">
                        <rect x="250" y="30" width="200" height="90" rx="10" fill="rgba(139, 92, 246, 0.2)"
                            stroke="#8b5cf6" stroke-width="2" />
                        <text x="350" y="55" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">1.72
                            δ, Nonet, 1H</text>
                        <text x="350" y="80" text-anchor="middle" fill="#f1f5f9" font-size="12">8+1=9重峰</text>
                        <text x="350" y="100" text-anchor="middle" fill="#f59e0b" font-size="12">被8个H耦合</text>
                    </g>

                    <!-- 信号3: 2H doublet -->
                    <g id="nmr4-step3" opacity="0">
                        <rect x="470" y="30" width="200" height="90" rx="10" fill="rgba(236, 72, 153, 0.2)"
                            stroke="#ec4899" stroke-width="2" />
                        <text x="570" y="55" text-anchor="middle" fill="#ec4899" font-size="14" font-weight="bold">3.16
                            δ, Doublet, 2H</text>
                        <text x="570" y="80" text-anchor="middle" fill="#f1f5f9" font-size="12">高位移 = 连I</text>
                        <text x="570" y="100" text-anchor="middle" fill="#f59e0b" font-size="12">-CH₂-I</text>
                    </g>

                    <!-- 逻辑推导 -->
                    <g id="nmr4-step4" opacity="0">
                        <rect x="100" y="140" width="500" height="80" rx="10" fill="rgba(245, 158, 11, 0.15)"
                            stroke="#f59e0b" />
                        <text x="350" y="170" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="bold">💡
                            逻辑推导</text>
                        <text x="350" y="195" text-anchor="middle" fill="#f1f5f9" font-size="12">1H (nonet) 被6H(CH₃×2) +
                            2H(CH₂) = 8个H耦合</text>
                    </g>

                    <!-- 结构确定 -->
                    <g id="nmr4-step5" opacity="0">
                        <rect x="150" y="240" width="400" height="100" rx="15" fill="rgba(16, 185, 129, 0.2)"
                            stroke="#10b981" stroke-width="3" />
                        <text x="350" y="275" text-anchor="middle" fill="#f1f5f9" font-size="16"
                            font-weight="bold">结构确定</text>
                        <text x="350" y="305" text-anchor="middle" fill="#10b981" font-size="18"
                            font-weight="bold">(CH₃)₂CH-CH₂-I</text>
                        <text x="350" y="330" text-anchor="middle" fill="#f59e0b" font-size="13">异丁基碘 (Isobutyl
                            iodide)</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('nmr4')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('nmr4')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-nmr4">步骤: 0/5</div>
            </div>
        </div>

        <!-- 工具2: 分子结构 -->
        <div class="card">
            <h2>工具2: 异丁基碘分子结构</h2>
            <div class="svg-container">
                <svg id="svg-struct4" width="700" height="300" viewBox="0 0 700 300">
                    <text x="350" y="30" text-anchor="middle" fill="#f1f5f9" font-size="18"
                        font-weight="bold">1-碘-2-甲基丙烷 (Isobutyl Iodide)</text>

                    <!-- 中心碳 -->
                    <g id="struct4-step1" opacity="0">
                        <circle cx="350" cy="150" r="35" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" />
                        <text x="350" y="145" text-anchor="middle" fill="#8b5cf6" font-size="16"
                            font-weight="bold">C</text>
                        <text x="350" y="165" text-anchor="middle" fill="#64748b" font-size="10">H</text>
                        <text x="350" y="195" text-anchor="middle" fill="#94a3b8" font-size="11">1.72δ (nonet)</text>
                    </g>

                    <!-- 左上CH3 -->
                    <g id="struct4-step2" opacity="0">
                        <line x1="320" y1="125" x2="260" y2="80" stroke="#6366f1" stroke-width="3" />
                        <circle cx="230" cy="65" r="32" fill="#1e293b" stroke="#10b981" stroke-width="3" />
                        <text x="230" y="60" text-anchor="middle" fill="#10b981" font-size="14"
                            font-weight="bold">CH₃</text>
                        <text x="230" y="80" text-anchor="middle" fill="#94a3b8" font-size="10">1.03δ</text>
                    </g>

                    <!-- 左下CH3 -->
                    <g id="struct4-step3" opacity="0">
                        <line x1="320" y1="175" x2="260" y2="220" stroke="#6366f1" stroke-width="3" />
                        <circle cx="230" cy="235" r="32" fill="#1e293b" stroke="#10b981" stroke-width="3" />
                        <text x="230" y="230" text-anchor="middle" fill="#10b981" font-size="14"
                            font-weight="bold">CH₃</text>
                        <text x="230" y="250" text-anchor="middle" fill="#94a3b8" font-size="10">1.03δ</text>
                    </g>

                    <!-- CH2 -->
                    <g id="struct4-step4" opacity="0">
                        <line x1="385" y1="150" x2="445" y2="150" stroke="#6366f1" stroke-width="3" />
                        <circle cx="480" cy="150" r="32" fill="#1e293b" stroke="#ec4899" stroke-width="3" />
                        <text x="480" y="145" text-anchor="middle" fill="#ec4899" font-size="14"
                            font-weight="bold">CH₂</text>
                        <text x="480" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">3.16δ</text>
                    </g>

                    <!-- I -->
                    <g id="struct4-step5" opacity="0">
                        <line x1="512" y1="150" x2="565" y2="150" stroke="#6366f1" stroke-width="3" />
                        <circle cx="600" cy="150" r="35" fill="#1e293b" stroke="#a855f7" stroke-width="3" />
                        <text x="600" y="158" text-anchor="middle" fill="#a855f7" font-size="22"
                            font-weight="bold">I</text>
                    </g>

                    <!-- 最终确认 -->
                    <g id="struct4-step6" opacity="0">
                        <rect x="150" y="260" width="400" height="35" rx="8" fill="rgba(16, 185, 129, 0.2)"
                            stroke="#10b981" />
                        <text x="350" y="283" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">✓
                            答案: (CH₃)₂CH-CH₂-I 异丁基碘</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('struct4')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('struct4')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-struct4">步骤: 0/6</div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 最终答案</h2>
            <div class="answer-box">
                <h3>化合物结构</h3>
                <p><strong>名称：</strong> 1-碘-2-甲基丙烷 (1-Iodo-2-methylpropane)</p>
                <p><strong>俗名：</strong> 异丁基碘 (Isobutyl iodide)</p>
                <p><strong>结构式：</strong> (CH₃)₂CH-CH₂-I</p>
            </div>
        </div>
    </div>

    <script>
        const animationStates = {
            nmr4: { current: 0, max: 5, elements: ['nmr4-step1', 'nmr4-step2', 'nmr4-step3', 'nmr4-step4', 'nmr4-step5'] },
            struct4: { current: 0, max: 6, elements: ['struct4-step1', 'struct4-step2', 'struct4-step3', 'struct4-step4', 'struct4-step5', 'struct4-step6'] }
        };

        function nextStep(animId) {
            const state = animationStates[animId];
            if (state.current < state.max) {
                const element = document.getElementById(state.elements[state.current]);
                if (element) { element.style.transition = 'opacity 0.5s ease-in-out'; element.style.opacity = '1'; }
                state.current++;
                updateStepIndicator(animId);
            } else { resetAnimation(animId); }
        }

        function resetAnimation(animId) {
            const state = animationStates[animId];
            state.elements.forEach(id => { const element = document.getElementById(id); if (element) { element.style.transition = 'opacity 0.3s ease-in-out'; element.style.opacity = '0'; } });
            state.current = 0;
            updateStepIndicator(animId);
        }

        function updateStepIndicator(animId) {
            const state = animationStates[animId];
            const indicator = document.getElementById(`step-${animId}`);
            if (indicator) { indicator.textContent = `步骤: ${state.current}/${state.max}`; }
        }

        Object.keys(animationStates).forEach(updateStepIndicator);
    </script>
</body>

</html>
