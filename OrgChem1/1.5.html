<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目I.5 - 有机合成填空</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h2::before {
            content: '🔬';
            font-size: 1.5rem;
        }

        .explanation {
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .svg-container {
            background: #0a0a1a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .highlight {
            color: var(--accent);
            font-weight: bold;
        }

        .answer-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(99, 102, 241, 0.2));
            border: 2px solid var(--accent);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .answer-box h3 {
            color: var(--accent);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 题目 I.5 - 有机合成填空</h1>

        <!-- 反应1: Diels-Alder -->
        <div class="card">
            <h2>反应1: Diels-Alder反应</h2>
            <div class="explanation">
                <strong>反应物：</strong> 异戊二烯 (Isoprene) + 丙炔醛 (Propynal)<br>
                <strong>类型：</strong> [4+2] 环加成反应
            </div>
            <div class="svg-container">
                <svg id="svg-da" width="700" height="350" viewBox="0 0 700 350">
                    <!-- 二烯: 异戊二烯 -->
                    <g id="da-step1" opacity="0">
                        <text x="100" y="30" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="bold">异戊二烯
                            (二烯)</text>

                        <circle cx="50" cy="100" r="25" fill="#1e293b" stroke="#10b981" stroke-width="2" />
                        <text x="50" y="105" text-anchor="middle" fill="#10b981" font-size="12"
                            font-weight="bold">C</text>

                        <line x1="75" y1="95" x2="105" y2="85" stroke="#ec4899" stroke-width="4" />
                        <line x1="75" y1="105" x2="105" y2="95" stroke="#ec4899" stroke-width="4" />

                        <circle cx="130" cy="80" r="25" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
                        <text x="130" y="85" text-anchor="middle" fill="#ec4899" font-size="12"
                            font-weight="bold">C</text>

                        <line x1="155" y1="80" x2="185" y2="100" stroke="#6366f1" stroke-width="3" />

                        <circle cx="210" cy="110" r="25" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
                        <text x="210" y="115" text-anchor="middle" fill="#ec4899" font-size="12"
                            font-weight="bold">C</text>

                        <line x1="235" y1="105" x2="265" y2="90" stroke="#ec4899" stroke-width="4" />
                        <line x1="235" y1="115" x2="265" y2="100" stroke="#ec4899" stroke-width="4" />

                        <circle cx="290" cy="85" r="25" fill="#1e293b" stroke="#10b981" stroke-width="2" />
                        <text x="290" y="90" text-anchor="middle" fill="#10b981" font-size="12"
                            font-weight="bold">C</text>

                        <!-- CH3 on C2 -->
                        <line x1="130" y1="55" x2="130" y2="25" stroke="#6366f1" stroke-width="2" />
                        <circle cx="130" cy="15" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
                        <text x="130" y="20" text-anchor="middle" fill="#f59e0b" font-size="10"
                            font-weight="bold">CH₃</text>
                    </g>

                    <!-- 加号 -->
                    <g id="da-step2" opacity="0">
                        <text x="370" y="100" fill="#f1f5f9" font-size="28" font-weight="bold">+</text>
                    </g>

                    <!-- 亲双烯体: 丙炔醛 -->
                    <g id="da-step3" opacity="0">
                        <text x="520" y="30" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="bold">丙炔醛
                            (亲双烯体)</text>

                        <circle cx="430" cy="100" r="22" fill="#1e293b" stroke="#64748b" stroke-width="2" />
                        <text x="430" y="105" text-anchor="middle" fill="#64748b" font-size="14"
                            font-weight="bold">H</text>

                        <line x1="452" y1="100" x2="478" y2="100" stroke="#a855f7" stroke-width="3" />
                        <line x1="452" y1="94" x2="478" y2="94" stroke="#a855f7" stroke-width="3" />
                        <line x1="452" y1="106" x2="478" y2="106" stroke="#a855f7" stroke-width="3" />

                        <circle cx="500" cy="100" r="25" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
                        <text x="500" y="105" text-anchor="middle" fill="#a855f7" font-size="12"
                            font-weight="bold">C≡</text>

                        <line x1="525" y1="100" x2="555" y2="100" stroke="#6366f1" stroke-width="3" />

                        <circle cx="580" cy="100" r="25" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
                        <text x="580" y="105" text-anchor="middle" fill="#ec4899" font-size="12"
                            font-weight="bold">C</text>

                        <line x1="580" y1="75" x2="580" y2="50" stroke="#ef4444" stroke-width="3" />
                        <line x1="586" y1="75" x2="586" y2="55" stroke="#ef4444" stroke-width="3" />

                        <circle cx="580" cy="38" r="18" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
                        <text x="580" y="43" text-anchor="middle" fill="#ef4444" font-size="12"
                            font-weight="bold">O</text>

                        <circle cx="580" cy="135" r="18" fill="#1e293b" stroke="#64748b" stroke-width="2" />
                        <text x="580" y="140" text-anchor="middle" fill="#64748b" font-size="12"
                            font-weight="bold">H</text>
                    </g>

                    <!-- 箭头 -->
                    <g id="da-step4" opacity="0">
                        <path d="M350 170 L350 220" stroke="#10b981" stroke-width="3" marker-end="url(#arrowG5)" />
                        <text x="380" y="200" fill="#10b981" font-size="14" font-weight="bold">Δ</text>
                    </g>

                    <!-- 产物: 环己二烯 -->
                    <g id="da-step5" opacity="0">
                        <text x="350" y="250" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="bold">产物:
                            环己二烯衍生物</text>

                        <!-- 六元环 with 2 double bonds -->
                        <polygon points="350,280 400,295 400,335 350,350 300,335 300,295" fill="none" stroke="#6366f1"
                            stroke-width="3" />

                        <!-- 双键 -->
                        <line x1="305" y1="300" x2="305" y2="330" stroke="#ec4899" stroke-width="3" />
                        <line x1="395" y1="300" x2="395" y2="330" stroke="#ec4899" stroke-width="3" />

                        <!-- CH3 -->
                        <circle cx="265" cy="315" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
                        <text x="265" y="320" text-anchor="middle" fill="#f59e0b" font-size="10"
                            font-weight="bold">CH₃</text>

                        <!-- CHO -->
                        <line x1="400" y1="315" x2="430" y2="315" stroke="#6366f1" stroke-width="2" />
                        <circle cx="455" cy="315" r="20" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
                        <text x="455" y="320" text-anchor="middle" fill="#ef4444" font-size="10"
                            font-weight="bold">CHO</text>
                    </g>

                    <defs>
                        <marker id="arrowG5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
                        </marker>
                    </defs>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('da')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('da')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-da">步骤: 0/5</div>
            </div>
        </div>

        <!-- 反应2: HCl加成 -->
        <div class="card">
            <h2>反应2: HCl对异戊二烯的加成</h2>
            <div class="explanation">
                <strong>反应：</strong> 异戊二烯 + 1 equiv HCl → ?<br>
                <strong>产物：</strong> 1,2-加成和1,4-加成产物
            </div>
            <div class="svg-container">
                <svg id="svg-hcl" width="700" height="400" viewBox="0 0 700 400">
                    <!-- 反应物 -->
                    <g id="hcl-step1" opacity="0">
                        <text x="180" y="30" text-anchor="middle" fill="#f1f5f9" font-size="14"
                            font-weight="bold">异戊二烯</text>
                        <text x="180" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">CH₂=C(CH₃)-CH=CH₂</text>

                        <text x="380" y="45" fill="#10b981" font-size="20" font-weight="bold">+ HCl</text>
                    </g>

                    <!-- 碳正离子形成 -->
                    <g id="hcl-step2" opacity="0">
                        <rect x="50" y="80" width="600" height="80" rx="10" fill="rgba(245, 158, 11, 0.15)"
                            stroke="#f59e0b" />
                        <text x="350" y="105" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">💡
                            H⁺先加成，形成最稳定的碳正离子</text>
                        <text x="350" y="130" text-anchor="middle" fill="#f59e0b"
                            font-size="12">甲基稳定叔碳正离子，共振稳定烯丙基正离子</text>
                    </g>

                    <!-- 产物1: 1,2-加成 -->
                    <g id="hcl-step3" opacity="0">
                        <text x="180" y="190" text-anchor="middle" fill="#ec4899" font-size="14"
                            font-weight="bold">1,2-加成产物</text>

                        <circle cx="80" cy="250" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2" />
                        <text x="80" y="255" text-anchor="middle" fill="#10b981" font-size="11"
                            font-weight="bold">CH₃</text>

                        <line x1="102" y1="250" x2="138" y2="250" stroke="#6366f1" stroke-width="3" />

                        <circle cx="160" cy="250" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2" />
                        <text x="160" y="245" text-anchor="middle" fill="#22d3ee" font-size="10"
                            font-weight="bold">C-Cl</text>
                        <text x="160" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">CH₃</text>

                        <line x1="182" y1="250" x2="218" y2="250" stroke="#6366f1" stroke-width="3" />

                        <circle cx="240" cy="250" r="22" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
                        <text x="240" y="255" text-anchor="middle" fill="#ec4899" font-size="11"
                            font-weight="bold">CH</text>

                        <line x1="260" y1="245" x2="295" y2="235" stroke="#ec4899" stroke-width="4" />
                        <line x1="260" y1="255" x2="295" y2="245" stroke="#ec4899" stroke-width="4" />

                        <circle cx="320" cy="230" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2" />
                        <text x="320" y="235" text-anchor="middle" fill="#10b981" font-size="11"
                            font-weight="bold">CH₂</text>
                    </g>

                    <!-- 产物2: 1,4-加成 -->
                    <g id="hcl-step4" opacity="0">
                        <text x="520" y="190" text-anchor="middle" fill="#8b5cf6" font-size="14"
                            font-weight="bold">1,4-加成产物</text>

                        <circle cx="400" cy="250" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2" />
                        <text x="400" y="255" text-anchor="middle" fill="#10b981" font-size="11"
                            font-weight="bold">CH₃</text>

                        <line x1="422" y1="250" x2="458" y2="250" stroke="#6366f1" stroke-width="3" />

                        <circle cx="480" cy="250" r="22" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
                        <text x="480" y="245" text-anchor="middle" fill="#ec4899" font-size="10"
                            font-weight="bold">C</text>
                        <text x="480" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">CH₃</text>

                        <line x1="500" y1="245" x2="535" y2="240" stroke="#ec4899" stroke-width="4" />
                        <line x1="500" y1="255" x2="535" y2="250" stroke="#ec4899" stroke-width="4" />

                        <circle cx="560" cy="240" r="22" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
                        <text x="560" y="245" text-anchor="middle" fill="#ec4899" font-size="11"
                            font-weight="bold">CH</text>

                        <line x1="582" y1="240" x2="618" y2="240" stroke="#6366f1" stroke-width="3" />

                        <circle cx="640" cy="240" r="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2" />
                        <text x="640" y="237" text-anchor="middle" fill="#22d3ee" font-size="10"
                            font-weight="bold">CH₂</text>
                        <text x="640" y="252" text-anchor="middle" fill="#22d3ee" font-size="9">Cl</text>
                    </g>

                    <!-- 说明 -->
                    <g id="hcl-step5" opacity="0">
                        <rect x="100" y="310" width="500" height="80" rx="10" fill="rgba(16, 185, 129, 0.15)"
                            stroke="#10b981" />
                        <text x="350" y="340" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">📊
                            产物分析</text>
                        <text x="350" y="365" text-anchor="middle" fill="#ec4899" font-size="12">动力学产物: 1,2-加成
                            (低温)</text>
                        <text x="350" y="385" text-anchor="middle" fill="#8b5cf6" font-size="12">热力学产物: 1,4-加成
                            (高温)</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('hcl')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('hcl')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-hcl">步骤: 0/5</div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 答案总结</h2>
            <div class="answer-box">
                <h3>反应1: Diels-Alder</h3>
                <p>异戊二烯 + 丙炔醛 → 甲基取代的环己二烯醛</p>
            </div>
            <div class="answer-box" style="margin-top: 1rem;">
                <h3>反应2: HCl加成</h3>
                <p>产生1,2-加成和1,4-加成两种氯代烯烃</p>
            </div>
        </div>
    </div>

    <script>
        const animationStates = {
            da: { current: 0, max: 5, elements: ['da-step1', 'da-step2', 'da-step3', 'da-step4', 'da-step5'] },
            hcl: { current: 0, max: 5, elements: ['hcl-step1', 'hcl-step2', 'hcl-step3', 'hcl-step4', 'hcl-step5'] }
        };

        function nextStep(animId) {
            const state = animationStates[animId];
            if (state.current < state.max) {
                const element = document.getElementById(state.elements[state.current]);
                if (element) { element.style.transition = 'opacity 0.5s ease-in-out'; element.style.opacity = '1'; }
                state.current++;
                updateStepIndicator(animId);
            } else { resetAnimation(animId); }
        }

        function resetAnimation(animId) {
            const state = animationStates[animId];
            state.elements.forEach(id => { const element = document.getElementById(id); if (element) { element.style.transition = 'opacity 0.3s ease-in-out'; element.style.opacity = '0'; } });
            state.current = 0;
            updateStepIndicator(animId);
        }

        function updateStepIndicator(animId) {
            const state = animationStates[animId];
            const indicator = document.getElementById(`step-${animId}`);
            if (indicator) { indicator.textContent = `步骤: ${state.current}/${state.max}`; }
        }

        Object.keys(animationStates).forEach(updateStepIndicator);
    </script>
</body>

</html>
