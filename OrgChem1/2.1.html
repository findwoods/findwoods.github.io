<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目II.1 - 能量图分析</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h2::before {
            content: '📊';
            font-size: 1.5rem;
        }

        .explanation {
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .svg-container {
            background: #0a0a1a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .highlight {
            color: var(--accent);
            font-weight: bold;
        }

        .answer-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(99, 102, 241, 0.2));
            border: 2px solid var(--accent);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .answer-box h3 {
            color: var(--accent);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 题目 II.1 - 能量图分析</h1>

        <div class="card">
            <h2>题目概述</h2>
            <p>分析反应能量图，比较各步骤速率常数的相对大小。</p>
            <div class="explanation">
                <strong>反应路径：</strong> A ⇌ B ⇌ C<br>
                <strong>速率常数：</strong> k₁ (A→B), k₋₁ (B→A), k₂ (B→C), k₋₂ (C→B)
            </div>
        </div>

        <!-- 能量图 -->
        <div class="card">
            <h2>工具1: 反应能量图</h2>
            <div class="svg-container">
                <svg id="svg-energy" width="700" height="450" viewBox="0 0 700 450">
                    <!-- 坐标轴 -->
                    <line x1="80" y1="400" x2="650" y2="400" stroke="#64748b" stroke-width="2" />
                    <line x1="80" y1="400" x2="80" y2="50" stroke="#64748b" stroke-width="2" />
                    <text x="350" y="440" fill="#f1f5f9" font-size="14" text-anchor="middle">反应坐标</text>
                    <text x="40" y="225" fill="#f1f5f9" font-size="14" text-anchor="middle"
                        transform="rotate(-90, 40, 225)">能量 E</text>

                    <!-- 能量曲线 -->
                    <g id="energy-step1" opacity="0">
                        <!-- A能级 -->
                        <line x1="100" y1="280" x2="180" y2="280" stroke="#10b981" stroke-width="4" />
                        <text x="140" y="300" fill="#10b981" font-size="16" text-anchor="middle"
                            font-weight="bold">A</text>

                        <!-- 上升到TS1 -->
                        <path d="M180 280 Q250 280, 280 100" stroke="#6366f1" stroke-width="3" fill="none" />

                        <!-- TS1 (最高峰) -->
                        <path d="M280 100 Q310 80, 340 100" stroke="#ef4444" stroke-width="4" fill="none" />
                        <text x="310" y="70" fill="#ef4444" font-size="14" text-anchor="middle"
                            font-weight="bold">TS₁</text>

                        <!-- 下降到B -->
                        <path d="M340 100 Q370 120, 400 200" stroke="#6366f1" stroke-width="3" fill="none" />

                        <!-- B能级 -->
                        <line x1="400" y1="200" x2="480" y2="200" stroke="#f59e0b" stroke-width="4" />
                        <text x="440" y="220" fill="#f59e0b" font-size="16" text-anchor="middle"
                            font-weight="bold">B</text>
                    </g>

                    <!-- 第二个山峰 -->
                    <g id="energy-step2" opacity="0">
                        <!-- 上升到TS2 -->
                        <path d="M480 200 Q510 200, 530 150" stroke="#6366f1" stroke-width="3" fill="none" />

                        <!-- TS2 (较低峰) -->
                        <path d="M530 150 Q550 140, 570 150" stroke="#ec4899" stroke-width="4" fill="none" />
                        <text x="550" y="125" fill="#ec4899" font-size="14" text-anchor="middle"
                            font-weight="bold">TS₂</text>

                        <!-- 下降到C -->
                        <path d="M570 150 Q590 160, 620 350" stroke="#6366f1" stroke-width="3" fill="none" />

                        <!-- C能级 (最低) -->
                        <line x1="620" y1="350" x2="680" y2="350" stroke="#22d3ee" stroke-width="4" />
                        <text x="650" y="375" fill="#22d3ee" font-size="16" text-anchor="middle"
                            font-weight="bold">C</text>
                    </g>

                    <!-- 活化能标注 -->
                    <g id="energy-step3" opacity="0">
                        <!-- Ea1 (A→B) 最大 -->
                        <line x1="140" y1="280" x2="140" y2="90" stroke="#ef4444" stroke-width="2"
                            stroke-dasharray="5,5" />
                        <line x1="130" y1="280" x2="150" y2="280" stroke="#ef4444" stroke-width="2" />
                        <line x1="130" y1="90" x2="150" y2="90" stroke="#ef4444" stroke-width="2" />
                        <text x="115" y="185" fill="#ef4444" font-size="12" font-weight="bold">Ea₁</text>
                        <text x="115" y="200" fill="#ef4444" font-size="10">(最大)</text>

                        <!-- Ea-1 (B→A) -->
                        <line x1="460" y1="200" x2="460" y2="90" stroke="#f59e0b" stroke-width="2"
                            stroke-dasharray="5,5" />
                        <text x="475" y="145" fill="#f59e0b" font-size="12" font-weight="bold">Ea₋₁</text>
                    </g>

                    <g id="energy-step4" opacity="0">
                        <!-- Ea2 (B→C) -->
                        <line x1="500" y1="200" x2="500" y2="145" stroke="#ec4899" stroke-width="2"
                            stroke-dasharray="5,5" />
                        <text x="515" y="175" fill="#ec4899" font-size="12" font-weight="bold">Ea₂</text>

                        <!-- Ea-2 (C→B) 很大 -->
                        <line x1="660" y1="350" x2="660" y2="145" stroke="#8b5cf6" stroke-width="2"
                            stroke-dasharray="5,5" />
                        <text x="640" y="250" fill="#8b5cf6" font-size="12" font-weight="bold">Ea₋₂</text>
                        <text x="640" y="265" fill="#8b5cf6" font-size="10">(很大)</text>
                    </g>

                    <!-- 速率分析 -->
                    <g id="energy-step5" opacity="0">
                        <rect x="100" y="390" width="550" height="55" rx="8" fill="rgba(16, 185, 129, 0.15)"
                            stroke="#10b981" />
                        <text x="375" y="415" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">💡
                            活化能越高 → 速率越慢 | 活化能越低 → 速率越快</text>
                        <text x="375" y="435" text-anchor="middle" fill="#f59e0b" font-size="12">Ea₁ > Ea₋₂ > Ea₋₁ ≈ Ea₂
                            → k₁ < k₋₂ < k₋₁ ≈ k₂</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('energy')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('energy')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-energy">步骤: 0/5</div>
            </div>
        </div>

        <!-- 速率常数比较 -->
        <div class="card">
            <h2>工具2: 速率常数排序</h2>
            <div class="svg-container">
                <svg id="svg-rate" width="700" height="300" viewBox="0 0 700 300">
                    <g id="rate-step1" opacity="0">
                        <text x="350" y="40" text-anchor="middle" fill="#f1f5f9" font-size="16"
                            font-weight="bold">速率常数与活化能的关系</text>
                        <text x="350" y="70" text-anchor="middle" fill="#f59e0b" font-size="14">k = A·e^(-Ea/RT)</text>
                        <text x="350" y="95" text-anchor="middle" fill="#94a3b8" font-size="12">Ea越大 → k越小 (反应越慢)</text>
                    </g>

                    <!-- 各k的比较 -->
                    <g id="rate-step2" opacity="0">
                        <rect x="80" y="120" width="120" height="60" rx="10" fill="rgba(239, 68, 68, 0.2)"
                            stroke="#ef4444" stroke-width="2" />
                        <text x="140" y="145" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="bold">k₁
                            (A→B)</text>
                        <text x="140" y="165" text-anchor="middle" fill="#ef4444" font-size="12">最慢 ⬇️</text>

                        <rect x="220" y="120" width="120" height="60" rx="10" fill="rgba(139, 92, 246, 0.2)"
                            stroke="#8b5cf6" stroke-width="2" />
                        <text x="280" y="145" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">k₋₂
                            (C→B)</text>
                        <text x="280" y="165" text-anchor="middle" fill="#8b5cf6" font-size="12">很慢</text>

                        <rect x="360" y="120" width="120" height="60" rx="10" fill="rgba(245, 158, 11, 0.2)"
                            stroke="#f59e0b" stroke-width="2" />
                        <text x="420" y="145" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">k₋₁
                            (B→A)</text>
                        <text x="420" y="165" text-anchor="middle" fill="#f59e0b" font-size="12">较快</text>

                        <rect x="500" y="120" width="120" height="60" rx="10" fill="rgba(16, 185, 129, 0.2)"
                            stroke="#10b981" stroke-width="2" />
                        <text x="560" y="145" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">k₂
                            (B→C)</text>
                        <text x="560" y="165" text-anchor="middle" fill="#10b981" font-size="12">较快 ⬆️</text>
                    </g>

                    <!-- 最终排序 -->
                    <g id="rate-step3" opacity="0">
                        <rect x="100" y="200" width="500" height="80" rx="15" fill="rgba(16, 185, 129, 0.2)"
                            stroke="#10b981" stroke-width="3" />
                        <text x="350" y="230" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="bold">📊
                            速率常数排序</text>
                        <text x="350" y="260" text-anchor="middle" fill="#10b981" font-size="20" font-weight="bold">k₋₂
                            < k₁ < k₋₁ ≈ k₂</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('rate')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('rate')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-rate">步骤: 0/3</div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 最终答案</h2>
            <div class="answer-box">
                <h3>速率常数排序</h3>
                <p><strong>从慢到快：</strong> k₋₂ < k₁ < k₋₁ ≈ k₂</p>
                        <p><strong>决速步：</strong> A → B (k₁最小)</p>
                        <p><strong>最稳定产物：</strong> C (能量最低，热力学产物)</p>
            </div>
        </div>
    </div>

    <script>
        const animationStates = {
            energy: { current: 0, max: 5, elements: ['energy-step1', 'energy-step2', 'energy-step3', 'energy-step4', 'energy-step5'] },
            rate: { current: 0, max: 3, elements: ['rate-step1', 'rate-step2', 'rate-step3'] }
        };

        function nextStep(animId) {
            const state = animationStates[animId];
            if (state.current < state.max) {
                const element = document.getElementById(state.elements[state.current]);
                if (element) { element.style.transition = 'opacity 0.5s ease-in-out'; element.style.opacity = '1'; }
                state.current++;
                updateStepIndicator(animId);
            } else { resetAnimation(animId); }
        }

        function resetAnimation(animId) {
            const state = animationStates[animId];
            state.elements.forEach(id => { const element = document.getElementById(id); if (element) { element.style.transition = 'opacity 0.3s ease-in-out'; element.style.opacity = '0'; } });
            state.current = 0;
            updateStepIndicator(animId);
        }

        function updateStepIndicator(animId) {
            const state = animationStates[animId];
            const indicator = document.getElementById(`step-${animId}`);
            if (indicator) { indicator.textContent = `步骤: ${state.current}/${state.max}`; }
        }

        Object.keys(animationStates).forEach(updateStepIndicator);
    </script>
</body>

</html>
