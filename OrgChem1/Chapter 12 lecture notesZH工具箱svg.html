<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红外光谱(IR)终极可视化教学系统</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --text-color: #2c3e50;
            --formula-bg: #e3f2fd;
            --formula-border: #2196f3;
            --trigger-bg: #fff8e1;
            --trigger-border: #ffb300;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            color: var(--text-color);
        }

        /* 侧边栏 */
        #sidebar {
            width: 260px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .nav-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: all 0.2s;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .nav-item:hover {
            background-color: #34495e;
            padding-left: 25px;
        }

        .nav-item.active {
            background-color: var(--accent-color);
            font-weight: bold;
            padding-left: 25px;
            border-left: 5px solid white;
        }

        /* 主内容容器 - 允许整体滚动 */
        #main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            /* 整个页面滚动 */
            padding: 20px 40px;
        }

        /* 顶部标题区 */
        #header-panel {
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        h2 {
            margin: 5px 0 0;
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: normal;
        }

        /* 内容布局：上图下文 */
        #content-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1000px;
            /* 限制最大宽度以保持阅读舒适 */
            margin: 0 auto;
            width: 100%;
        }

        /* 可视化舞台 */
        #stage-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
            position: relative;
            height: 450px;
            /* 固定高度给动画 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* 解释区域 */
        #info-panel {
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 控制按钮栏 */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        button.accent {
            background-color: var(--accent-color);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #bdc3c7;
            color: #bdc3c7;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        /* 卡片通用样式 */
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        /* 公式卡片 */
        .formula-box {
            background-color: var(--formula-bg);
            border-left: 6px solid var(--formula-border);
            color: #1565c0;
            font-family: 'Times New Roman', serif;
            font-size: 1.4rem;
            padding: 15px 25px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            display: flex;
            flex-direction: column;
        }

        .formula-label {
            font-family: sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #1976d2;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* 触发器卡片 */
        .trigger-box {
            background-color: var(--trigger-bg);
            border: 2px dashed var(--trigger-border);
            color: #e65100;
            border-radius: 8px;
            padding: 15px 25px;
            margin-bottom: 10px;
        }

        .trigger-title {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: #f57c00;
        }

        .trigger-content {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 文本内容 */
        .text-content {
            color: #333;
        }

        .highlight {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 动画原子样式 */
        .atom-circle {
            stroke: #2c3e50;
            stroke-width: 2px;
        }

        .atom-text {
            font-family: Arial, sans-serif;
            font-weight: 900;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }


        /* Mobile Adapts */
        .menu-toggle {
            display: none;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            #sidebar.active {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            #main-wrapper {
                width: 100%;
                padding: 60px 20px 20px 20px;
            }

            #stage-container {
                height: 300px;
            }

            svg {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰ 目录</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div class="nav-header">IR 光谱专家系统</div>
        <div class="nav-item active" onclick="loadScene(0)">1. 核心心智模型：弹簧系统</div>
        <div class="nav-item" onclick="loadScene(1)">2. 通用解题步骤：扫描程序</div>
        <div class="nav-item" onclick="loadScene(2)">3. 工具1：胡克定律 (公式原理)</div>
        <div class="nav-item" onclick="loadScene(3)">4. 工具2：折合质量 (轻重定则)</div>
        <div class="nav-item" onclick="loadScene(4)">5. 工具3：势能曲线 (键能深浅)</div>
        <div class="nav-item" onclick="loadScene(5)">6. 工具4：C-H 杂化 (3000分界)</div>
        <div class="nav-item" onclick="loadScene(6)">7. 工具5：氧的踪迹一 (羟基)</div>
        <div class="nav-item" onclick="loadScene(7)">8. 工具6：氧的踪迹二 (羰基)</div>
        <div class="nav-item" onclick="loadScene(8)">9. 工具7：指纹区 (C-O)</div>
        <div class="nav-item" onclick="loadScene(9)">10. 工具8：不饱和度 (C=C)</div>
    </div>

    <div id="main-wrapper">
        <div id="header-panel">
            <h1 id="scene-title">载入中...</h1>
            <h2 id="scene-subtitle">...</h2>
        </div>

        <div id="content-layout">
            <!-- 上方：SVG 动画 -->
            <div id="stage-container">
                <svg id="svg-stage" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
                    <!-- JS 生成内容 -->
                </svg>
            </div>

            <!-- 下方：详细解释 (无内部滚动条，直接展示) -->
            <div id="info-panel">
                <div class="controls">
                    <button class="primary" id="btn-prev" onclick="changeStep(-1)">⬅ 上一步</button>
                    <button class="accent" id="btn-play" onclick="togglePlay()">⏯ 暂停/播放</button>
                    <button class="primary" id="btn-reset" onclick="resetScene()">↺ 重置动画</button>
                    <button class="primary" id="btn-next" onclick="changeStep(1)" style="margin-left:auto">下一步
                        ➡</button>
                </div>

                <div id="dynamic-content">
                    <!-- 内容区 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }
        // === 配置 ===
        const ATOM_RADIUS = 32; // 32px
        const ATOM_FONT_SIZE = "22px"; // 高可见度
        const COLORS = {
            C: "#95a5a6", H: "#ffffff", O: "#e74c3c", N: "#3498db",
            Cl: "#2ecc71", Br: "#9b59b6", D: "#7f8c8d",
            Bg: "#ecf0f1"
        };

        // === 场景数据 ===
        const scenes = [
            {
                title: "核心认知与心智模型",
                subtitle: "弃静止，建动态：微观弹簧力学系统",
                steps: [
                    {
                        formula: "Model: Mass + Spring",
                        trigger: "看到分子结构 ➔ 想到颤动的弹簧系统",
                        text: "要成为专家，首先必须闭上眼睛，建立这样一个动态模型：<br>分子不是刚性棍棒连接的静止球体，而是一个由<span class='highlight'>'有质量的小球'（原子）</span>和<span class='highlight'>'不仅能伸缩还能弯曲的弹簧'（化学键）</span>组成的不断颤动、跳舞的机械系统。<br><br>图中展示了最简单的双原子分子伸缩振动。",
                        objects: [{ type: 'diatomic', a1: 'C', a2: 'C', k: 1, m: 1, y: 200 }]
                    },
                    {
                        formula: "E_{photon} = h\\nu_{vibration}",
                        trigger: "看到吸收峰 ➔ 想到推秋千推准了(共振)",
                        text: "红外光谱仪测量的是频率。当红外光的频率恰好等于化学键'弹簧'的固有频率时，化学键会<span class='highlight'>贪婪地吸收能量</span>，振幅剧烈增大。<br><br>点击播放观察：这就是共振。解读图谱就是一场**逆向工程**：通过频率反推原子质量(m)和弹簧硬度(k)。",
                        objects: [{ type: 'diatomic', a1: 'C', a2: 'C', k: 1, m: 1, y: 200, resonance: true }]
                    }
                ]
            },
            {
                title: "通用解题步骤",
                subtitle: "侦探式扫描程序：从左向右，由高频到低频",
                steps: [
                    {
                        formula: "Zone 1: 4000 - 2500 cm^{-1}",
                        trigger: "看到左侧高频区 ➔ 找 H 原子",
                        text: "第一步：扫描高频区。这是<span class='highlight'>氢原子</span>的专属领地。<br>H 原子质量极小(1)，所以频率最高。重点寻找：<br>1. O-H (宽峰)<br>2. N-H<br>3. C-H<br>特别注意 3000 分界线。",
                        objects: [{ type: 'spectrum', zone: 1 }]
                    },
                    {
                        formula: "Zone 2: 2500 - 2000 cm^{-1}",
                        trigger: "看到这里有峰 ➔ 锁定三键",
                        text: "第二步：扫描三键与累积双键区。这是光谱的'荒漠'，通常空空如也。<br>如果这里出现明显的峰，几乎可以直接锁定：<br><span class='highlight'>C≡C</span> 或 <span class='highlight'>C≡N</span>。",
                        objects: [{ type: 'spectrum', zone: 2 }]
                    },
                    {
                        formula: "Zone 3: 2000 - 1500 cm^{-1}",
                        trigger: "看到最强尖峰 ➔ 锁定 C=O 灯塔",
                        text: "第三步：扫描双键区。这是分子骨架的'黄金地段'。<br>必须寻找 <span class='highlight'>C=O (1700左右，最强)</span> 或 <span class='highlight'>C=C (1600左右，较弱)</span>。",
                        objects: [{ type: 'spectrum', zone: 3 }]
                    }
                ]
            },
            {
                title: "工具1：谐振子与胡克定律",
                subtitle: "红外光谱的终极物理方程",
                steps: [
                    {
                        formula: "\\nu = \\frac{1}{2\\pi c} \\sqrt{\\frac{k}{\\mu}}",
                        trigger: "看到频率比较题 ➔ 默念：硬弹簧快，轻原子快",
                        text: "这是核心公式。频率 ν 由两个变量决定：<br>1. <strong>k (力常数)</strong>：键越强(三键>双键>单键)，弹簧越硬，频率越高。<br>2. <strong>μ (折合质量)</strong>：原子越轻，惯性越小，频率越高。<br><br>演示：上方 C=C (k大) 振动快，下方 C-C (k小) 振动慢。",
                        objects: [
                            { type: 'diatomic', a1: 'C', a2: 'C', k: 2.0, m: 1, y: 120, label: 'C=C (硬) 高频' },
                            { type: 'diatomic', a1: 'C', a2: 'C', k: 0.5, m: 1, y: 280, label: 'C-C (软) 低频' }
                        ]
                    },
                    {
                        formula: "\\nu_{C-H} / \\nu_{C-D} \\approx 1.36",
                        trigger: "看到同位素(D) ➔ 想到质量变大，频率降低",
                        text: "同位素效应是质量影响的铁证。<br>将 H 换成 D (重氢)，k 不变，但 μ 变大(分母变大)。<br>结果：<span class='highlight'>C-D 的频率显著低于 C-H</span>。<br>C-H ~ 2900 cm⁻¹ ➔ C-D ~ 2150 cm⁻¹。",
                        objects: [
                            { type: 'diatomic', a1: 'C', a2: 'H', k: 1, m: 0.1, y: 120, label: 'C-H (轻) 快' },
                            { type: 'diatomic', a1: 'C', a2: 'D', k: 1, m: 0.2, y: 280, label: 'C-D (重) 慢' }
                        ]
                    }
                ]
            },
            {
                title: "工具2：折合质量与原子轻重定则",
                subtitle: "谁轻谁疯狂",
                steps: [
                    {
                        formula: "\\mu \\approx m_{light} \\quad (m_{small} \\ll m_{large})",
                        trigger: "看到 2500 以上的区域 ➔ 必须含 H",
                        text: "想象大胖子(C)和小瘦子(H)用弹簧连着。<br>振动时，大胖子几乎不动，主要是小瘦子在疯狂跳动。<br>因为 H 质量极小，导致频率极高，独占光谱最左侧。",
                        objects: [{ type: 'diatomic', a1: 'C', a2: 'H', k: 1, m: 0.1, y: 200, showVector: true, label: 'H 原子大幅振动' }]
                    },
                    {
                        formula: "\\mu_{large} \\rightarrow \\nu_{low}",
                        trigger: "看到重原子 (Cl, Br) ➔ 想到指纹区最右端",
                        text: "如果是两个大胖子(C-Cl)，谁也拉不动谁。<br>折合质量大，振动极其缓慢，出现在指纹区深处 (600-800 cm⁻¹)。",
                        objects: [{ type: 'diatomic', a1: 'C', a2: 'Cl', k: 0.8, m: 3.0, y: 200, showVector: true, label: 'C-Cl 笨重缓慢' }]
                    }
                ]
            },
            {
                title: "工具3：势能曲线与键解离能",
                subtitle: "Morse Potential：深坑与硬弹簧",
                steps: [
                    {
                        formula: "Deep\\ Well \\rightarrow High\\ k \\rightarrow High\\ \\nu",
                        trigger: "看到深且窄的势能井 ➔ 强键、高频",
                        text: "【势能深谷】<br>化学键是个山谷。<br><strong>键解离能 D</strong> = 山谷深度（断键能量）。<br><strong>力常数 k</strong> = 谷底的陡峭程度（开口宽窄）。<br><br>通常：山谷越深（键强），谷底越陡（k大），频率越高（如三键）。",
                        objects: [{ type: 'morse', depth: 'deep', width: 'narrow', y: 200, label: '强键 (深窄)' }]
                    },
                    {
                        formula: "Shallow\\ Well \\rightarrow Low\\ k \\rightarrow Low\\ \\nu",
                        trigger: "看到浅且宽的势能井 ➔ 弱键、低频",
                        text: "单键 (C-C) 的山谷较浅且宽。<br>开口宽意味着把原子推开一点点很容易（弹簧软，k小），所以频率低。",
                        objects: [{ type: 'morse', depth: 'shallow', width: 'wide', y: 200, label: '弱键 (浅宽)' }]
                    }
                ]
            },
            {
                title: "工具4：C-H 杂化分界线",
                subtitle: "3000 cm⁻¹ 铁律",
                steps: [
                    {
                        formula: "Boundary = 3000\\ cm^{-1}",
                        trigger: "拿出尺子切在3000 ➔ 左边不饱和，右边饱和",
                        text: "这是一条严格的国境线：<br><strong>左侧 (>3000)</strong>：sp² 杂化 (=C-H)。对应烯烃或苯环。<br><strong>右侧 (<3000)</strong>：sp³ 杂化 (-C-H)。对应饱和烷基链。",
                        objects: [{ type: 'hybrid_split', y: 200 }]
                    },
                    {
                        formula: "s\\% \\uparrow \\rightarrow k \\uparrow \\rightarrow \\nu \\uparrow",
                        trigger: "为什么左边高？ ➔ s轨道成分多，抓得紧",
                        text: "sp² (33% s成分) 比 sp³ (25% s成分) 的电子更靠近原子核。<br>结果：键长更短，键更硬(k大)，频率更高。<br>演示：上方烯烃 C-H 振动略快于下方烷烃 C-H。",
                        objects: [
                            { type: 'hybrid', bond: 'double', k: 1.2, y: 120, label: '>3000 (=C-H)' },
                            { type: 'hybrid', bond: 'single', k: 1.0, y: 280, label: '<3000 (-C-H)' }
                        ]
                    }
                ]
            },
            {
                title: "工具5：氧的踪迹一 (羟基)",
                subtitle: "氢键导致的特征宽峰",
                steps: [
                    {
                        formula: "Hydrogen\\ Bond \\rightarrow Broadening",
                        trigger: "看到左侧大舌头/深谷 ➔ 醇 (Alcohol)",
                        text: "为什么是宽峰？<br>这是大量分子的统计结果。氢键 (H...O) 拉扯着 H，且力度是随机分布的。<br>这导致力常数 k 连续变化，频率分散，形成光滑的 U 型宽峰。",
                        objects: [{ type: 'hbond', form: 'alcohol', y: 200 }]
                    },
                    {
                        formula: "Dimer \\rightarrow Extremely\\ Broad",
                        trigger: "看到极宽的大胡子覆盖3000 ➔ 羧酸 (Acid)",
                        text: "羧酸能形成稳固的二聚体，氢键极强。<br>峰形极宽且乱，从 3300 一直蔓延到 2500，底部把 C-H 峰都“吃”进去了。",
                        objects: [{ type: 'hbond', form: 'acid', y: 200 }]
                    }
                ]
            },
            {
                title: "工具6：氧的踪迹二 (羰基)",
                subtitle: "1700 cm⁻¹ 的灯塔",
                steps: [
                    {
                        formula: "Intensity \\propto (d\\mu/dq)^2",
                        trigger: "看到1700左右的最强尖峰 ➔ 必定有 C=O",
                        text: "C=O 极性极大。伸缩振动时，偶极矩(μ)变化极其剧烈，因此吸收极强。<br>它是图谱中的定海神针。如果没有这根针，可以划掉所有酮、醛、酸、酯。",
                        objects: [{ type: 'dipole', a1: 'C', a2: 'O', k: 1.5, strong: true, y: 200 }]
                    },
                    {
                        formula: "\\nu_{Ester} > \\nu_{Ketone}",
                        trigger: "细分：1740是酯，1715是酮",
                        text: "<strong>酯 (1740)</strong>：单键氧的诱导效应吸走电子，使 C=O 键变短变硬，频率升高。<br><strong>酮 (1715)</strong>：标准频率。",
                        objects: [
                            { type: 'diatomic', a1: 'C', a2: 'O', k: 1.7, m: 1.2, y: 120, label: '酯 (1740) 高频' },
                            { type: 'diatomic', a1: 'C', a2: 'O', k: 1.5, m: 1.2, y: 280, label: '酮 (1715) 标准' }
                        ]
                    }
                ]
            },
            {
                title: "工具7：指纹区拼图 (C-O)",
                subtitle: "1000-1300 的最强音",
                steps: [
                    {
                        formula: "\\nu_{C-O} \\approx 1000 - 1300",
                        trigger: "怀疑是酯/醇/酸时 ➔ 必须来这里找证据",
                        text: "指纹区通常很乱，但 C-O 单键因为有极性，吸收强，能从乱麻中跳出来。<br>对于酯类化合物，这里通常有两根强峰（猫耳朵）。",
                        objects: [{ type: 'diatomic', a1: 'C', a2: 'O', k: 0.6, m: 1.2, y: 200, label: 'C-O 单键 (强峰)' }]
                    }
                ]
            },
            {
                title: "工具8：不饱和度 (C=C)",
                subtitle: "害羞的小土丘",
                steps: [
                    {
                        formula: "\\mu_{dipole} \\approx 0",
                        trigger: "看到1650弱峰 + 3080 C-H ➔ 确认烯烃",
                        text: "C=C 双键两端电负性差异小，偶极矩变化弱。<br>所以吸收峰往往很弱（中等甚至看不见），常躲在 C=O 的阴影里。<br>如果分子对称（如乙烯），红外甚至不吸收。",
                        objects: [
                            { type: 'dipole', a1: 'C', a2: 'C', k: 1.3, strong: false, y: 200, label: 'C=C (弱峰)' }
                        ]
                    }
                ]
            }
        ];

        // === 逻辑控制 ===
        let currentSceneIndex = 0;
        let currentStepIndex = 0;
        let isPlaying = true;
        let animationId = null;
        let time = 0;

        function init() {
            loadScene(0);
            animate();
        }

        function loadScene(index) {
            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            currentSceneIndex = index;
            currentStepIndex = 0;
            updateContent();
        }

        function changeStep(delta) {
            const scene = scenes[currentSceneIndex];
            const newStep = currentStepIndex + delta;
            if (newStep >= 0 && newStep < scene.steps.length) {
                currentStepIndex = newStep;
                updateContent();
            }
        }

        function updateContent() {
            const scene = scenes[currentSceneIndex];
            const step = scene.steps[currentStepIndex];

            document.getElementById('scene-title').innerText = scene.title;
            document.getElementById('scene-subtitle').innerText = scene.subtitle;

            let html = '';

            // 1. 公式卡片
            if (step.formula) {
                html += `<div class="card formula-box">
                        <span class="formula-label">核心公式 (PHYSICS)</span>
                        <div>${formatFormula(step.formula)}</div>
                     </div>`;
            }

            // 2. 触发器卡片
            if (step.trigger) {
                const parts = step.trigger.split('➔');
                html += `<div class="card trigger-box">
                        <span class="trigger-title">💡 专家直觉 (Expert Intuition)</span>
                        <div class="trigger-content">
                            <span>${parts[0]}</span> 
                            <span style="font-size:1.5em">➔</span> 
                            <span style="color:#bf360c">${parts[1]}</span>
                        </div>
                     </div>`;
            }

            // 3. 文本解释
            html += `<div class="card text-content">${step.text}</div>`;

            document.getElementById('dynamic-content').innerHTML = html;

            // 按钮状态
            document.getElementById('btn-prev').disabled = currentStepIndex === 0;
            document.getElementById('btn-next').disabled = currentStepIndex === scene.steps.length - 1;

            // 重置动画
            time = 0;
            renderFrame();
        }

        // 简易公式格式化
        function formatFormula(str) {
            return str
                .replace(/\\frac{([^}]+)}{([^}]+)}/g, '<sup>$1</sup>&frasl;<sub>$2</sub>')
                .replace(/\\sqrt{([^}]+)}/g, '√($1)')
                .replace(/\\pi/g, 'π')
                .replace(/\\nu/g, 'ν')
                .replace(/\\mu/g, 'μ')
                .replace(/\\approx/g, '≈')
                .replace(/\\rightarrow/g, '→')
                .replace(/\\uparrow/g, '↑')
                .replace(/\\downarrow/g, '↓')
                .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>')
                .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) animate();
        }

        function resetScene() {
            time = 0;
            if (!isPlaying) { isPlaying = true; animate(); }
        }

        function animate() {
            if (!isPlaying) return;
            time += 0.05;
            renderFrame();
            animationId = requestAnimationFrame(animate);
        }

        // === SVG 绘图引擎 ===
        function renderFrame() {
            const svg = document.getElementById('svg-stage');
            svg.innerHTML = '';
            const step = scenes[currentSceneIndex].steps[currentStepIndex];

            step.objects.forEach(obj => {
                switch (obj.type) {
                    case 'diatomic': drawDiatomic(svg, obj); break;
                    case 'spectrum': drawSpectrum(svg, obj); break;
                    case 'morse': drawMorse(svg, obj); break;
                    case 'hybrid': drawHybrid(svg, obj); break;
                    case 'hybrid_split': drawHybridSplit(svg, obj); break;
                    case 'hbond': drawHBond(svg, obj); break;
                    case 'dipole': drawDipole(svg, obj); break;
                }
            });
        }

        // --- 组件绘制函数 ---

        function createAtom(x, y, label, radius = ATOM_RADIUS) {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x); circle.setAttribute("cy", y);
            circle.setAttribute("r", radius);
            circle.setAttribute("fill", COLORS[label] || "#bdc3c7");
            circle.classList.add("atom-circle");

            if (label === 'H') {
                circle.setAttribute("stroke", "#333");
                circle.setAttribute("stroke-width", "2");
            }

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x); text.setAttribute("y", y);
            text.setAttribute("class", "atom-text");
            text.setAttribute("font-size", ATOM_FONT_SIZE);
            text.setAttribute("fill", (label === 'H' || label === 'C') ? "#333" : "#fff");
            text.textContent = label;

            g.appendChild(circle);
            g.appendChild(text);
            return g;
        }

        function createSpring(x1, y1, x2, y2, thickness) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const dx = x2 - x1; const dy = y2 - y1;
            const angle = Math.atan2(dy, dx);

            const turns = 10;
            const amp = 8;
            let d = `M ${x1} ${y1} `;

            for (let i = 0; i <= turns; i++) {
                const ratio = i / turns;
                const px = x1 + dx * ratio;
                const py = y1 + dy * ratio;
                const perpX = -Math.sin(angle) * (i % 2 === 0 ? amp : -amp) * (i === 0 || i === turns ? 0 : 1);
                const perpY = Math.cos(angle) * (i % 2 === 0 ? amp : -amp) * (i === 0 || i === turns ? 0 : 1);
                d += `L ${px + perpX} ${py + perpY} `;
            }

            path.setAttribute("d", d);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#555");
            path.setAttribute("stroke-width", 2 * (thickness || 1));
            path.setAttribute("stroke-linecap", "round");
            return path;
        }

        // 1. 双原子振动
        function drawDiatomic(svg, obj) {
            const cx = 400; const cy = obj.y;
            const baseLen = 140;
            const freq = Math.sqrt(obj.k / obj.m) * 2.5;
            let amp = 15;
            if (obj.resonance) amp = 15 + Math.min(60, time * 6); // 共振放大

            const disp = Math.sin(time * freq) * amp;
            const m1 = (obj.a1 === 'H') ? 1 : 12;
            const m2 = (obj.a2 === 'H') ? 1 : (obj.a2 === 'D' ? 2 : (obj.a2 === 'Cl' ? 35 : 12));
            const total = m1 + m2;

            const x1 = cx - baseLen / 2 + disp * (m2 / total);
            const x2 = cx + baseLen / 2 - disp * (m1 / total);

            svg.appendChild(createSpring(x1 + ATOM_RADIUS, cy, x2 - ATOM_RADIUS, cy, obj.k));
            svg.appendChild(createAtom(x1, cy, obj.a1));
            svg.appendChild(createAtom(x2, cy, obj.a2));

            if (obj.label) {
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", cx); t.setAttribute("y", cy + 55);
                t.setAttribute("text-anchor", "middle"); t.setAttribute("fill", "#7f8c8d");
                t.textContent = obj.label;
                svg.appendChild(t);
            }
        }

        // 2. 光谱
        function drawSpectrum(svg, obj) {
            const width = 700; const height = 250;
            const sx = 50; const sy = 350;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", sx); line.setAttribute("y1", sy);
            line.setAttribute("x2", sx + width); line.setAttribute("y2", sy);
            line.setAttribute("stroke", "#333"); line.setAttribute("stroke-width", 2);
            svg.appendChild(line);

            [4000, 3000, 2000, 1500, 1000, 500].forEach(m => {
                const x = sx + (4000 - m) / 3500 * width;
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", x); t.setAttribute("y", sy + 25);
                t.setAttribute("text-anchor", "middle"); t.textContent = m;
                svg.appendChild(t);
            });

            let zx, zw, col, txt;
            if (obj.zone === 1) { zx = sx; zw = (1500 / 3500) * width; col = "#e74c3c"; txt = "H区 (O-H, N-H, C-H)"; }
            else if (obj.zone === 2) { zx = sx + (1500 / 3500) * width; zw = (500 / 3500) * width; col = "#f1c40f"; txt = "三键区"; }
            else if (obj.zone === 3) { zx = sx + (2000 / 3500) * width; zw = (500 / 3500) * width; col = "#3498db"; txt = "双键区 (C=O, C=C)"; }

            if (zx) {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", zx); rect.setAttribute("y", sy - 200);
                rect.setAttribute("width", zw); rect.setAttribute("height", 200);
                rect.setAttribute("fill", col); rect.setAttribute("opacity", 0.2);
                svg.appendChild(rect);

                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", zx + zw / 2); t.setAttribute("y", sy - 210);
                t.setAttribute("text-anchor", "middle"); t.setAttribute("fill", col);
                t.setAttribute("font-weight", "bold"); t.setAttribute("font-size", "18");
                t.textContent = txt;
                svg.appendChild(t);
            }
        }

        // 3. Morse 势能
        function drawMorse(svg, obj) {
            const cx = 400; const cy = obj.y + 80;
            const D = obj.depth === 'deep' ? 150 : 60;
            const a = obj.width === 'narrow' ? 0.04 : 0.02;

            let path = `M ${cx - 150} ${cy - 20} `;
            for (let x = -150; x <= 150; x += 5) {
                const y = D * Math.pow(1 - Math.exp(-a * x), 2);
                path += `L ${cx + x} ${cy - y} `;
            }

            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", path); p.setAttribute("fill", "none");
            p.setAttribute("stroke", obj.depth === 'deep' ? "#c0392b" : "#7f8c8d");
            p.setAttribute("stroke-width", 3);
            svg.appendChild(p);

            const px = Math.sin(time * (obj.depth === 'deep' ? 10 : 4)) * (obj.depth === 'deep' ? 20 : 50);
            const py = D * Math.pow(1 - Math.exp(-a * px), 2);

            const ball = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            ball.setAttribute("cx", cx + px); ball.setAttribute("cy", cy - py - 10);
            ball.setAttribute("r", 10); ball.setAttribute("fill", "#2c3e50");
            svg.appendChild(ball);

            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", cx); label.setAttribute("y", cy + 40);
            label.setAttribute("text-anchor", "middle"); label.textContent = obj.label;
            svg.appendChild(label);
        }

        // 4. 杂化分割
        function drawHybridSplit(svg, obj) {
            const cx = 400; const cy = obj.y;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", cx); line.setAttribute("y1", cy - 100);
            line.setAttribute("x2", cx); line.setAttribute("y2", cy + 100);
            line.setAttribute("stroke", "#e74c3c"); line.setAttribute("stroke-width", 3);
            line.setAttribute("stroke-dasharray", "8,4");
            svg.appendChild(line);

            const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t.setAttribute("x", cx); t.setAttribute("y", cy + 130);
            t.setAttribute("text-anchor", "middle"); t.setAttribute("font-weight", "bold");
            t.setAttribute("fill", "#c0392b"); t.textContent = "3000 cm⁻¹";
            svg.appendChild(t);

            const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t1.setAttribute("x", cx - 120); t1.setAttribute("y", cy);
            t1.setAttribute("text-anchor", "middle"); t1.setAttribute("font-size", "20");
            t1.textContent = "sp² 不饱和 (=C-H)";
            svg.appendChild(t1);

            const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t2.setAttribute("x", cx + 120); t2.setAttribute("y", cy);
            t2.setAttribute("text-anchor", "middle"); t2.setAttribute("font-size", "20");
            t2.textContent = "sp³ 饱和 (-C-H)";
            svg.appendChild(t2);
        }

        function drawHybrid(svg, obj) {
            const cx = 400; const cy = obj.y;
            const len = obj.bond === 'double' ? 120 : 150;
            const disp = Math.sin(time * (obj.bond === 'double' ? 12 : 8)) * 10;

            svg.appendChild(createSpring(cx - len / 2 + 32, cy, cx + len / 2 + disp - 32, cy, obj.k / 1.5));
            svg.appendChild(createAtom(cx - len / 2, cy, 'C'));
            svg.appendChild(createAtom(cx + len / 2 + disp, cy, 'H'));

            const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t.setAttribute("x", cx); t.setAttribute("y", cy + 50);
            t.setAttribute("text-anchor", "middle"); t.textContent = obj.label;
            svg.appendChild(t);
        }

        // 5. 氢键
        function drawHBond(svg, obj) {
            const cx = 350; const cy = obj.y;

            for (let i = 0; i < 3; i++) {
                const y = cy - 80 + i * 80;
                const k = 1.0 + Math.sin(time * 0.5 + i) * 0.2;
                const len = 100 + Math.sin(time * 5 * k) * 10;

                svg.appendChild(createSpring(cx, y, cx + len, y, 1));
                svg.appendChild(createAtom(cx, y, 'O'));
                svg.appendChild(createAtom(cx + len, y, 'H'));

                if (i < 2 || obj.form === 'acid') {
                    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    l.setAttribute("x1", cx + len + 32); l.setAttribute("y1", y);
                    l.setAttribute("x2", cx + len + 80); l.setAttribute("y2", y + (obj.form === 'acid' ? 30 : 0));
                    l.setAttribute("stroke", "#e74c3c"); l.setAttribute("stroke-dasharray", "4,4");
                    l.setAttribute("opacity", Math.abs(Math.sin(time + i)));
                    svg.appendChild(l);
                }
            }

            const pathD = obj.form === 'alcohol' ? "M 600 200 Q 650 280 700 200" : "M 600 200 Q 650 350 750 200";
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", pathD); p.setAttribute("fill", "none");
            p.setAttribute("stroke", "#e74c3c"); p.setAttribute("stroke-width", 3);
            svg.appendChild(p);

            const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t.setAttribute("x", 675); t.setAttribute("y", 180);
            t.setAttribute("text-anchor", "middle"); t.textContent = obj.form === 'alcohol' ? "醇：光滑舌头" : "酸：宽乱胡子";
            svg.appendChild(t);
        }

        // 6. 偶极矩
        function drawDipole(svg, obj) {
            const cx = 400; const cy = obj.y;
            const freq = Math.sqrt(obj.k) * 3;
            const amp = 15;
            const disp = Math.sin(time * freq) * amp;

            const x1 = cx - 70 - disp / 2;
            const x2 = cx + 70 + disp / 2;

            const l1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            l1.setAttribute("x1", x1 + 32); l1.setAttribute("y1", cy - 6);
            l1.setAttribute("x2", x2 - 32); l1.setAttribute("y2", cy - 6);
            l1.setAttribute("stroke", "#555"); l1.setAttribute("stroke-width", 3);
            svg.appendChild(l1);

            const l2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            l2.setAttribute("x1", x1 + 32); l2.setAttribute("y1", cy + 6);
            l2.setAttribute("x2", x2 - 32); l2.setAttribute("y2", cy + 6);
            l2.setAttribute("stroke", "#555"); l2.setAttribute("stroke-width", 3);
            svg.appendChild(l2);

            svg.appendChild(createAtom(x1, cy, obj.a1));
            svg.appendChild(createAtom(x2, cy, obj.a2));

            if (obj.strong) {
                const op = 0.5 + (disp + amp) / (2 * amp) * 0.5;
                const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t1.setAttribute("x", x1); t1.setAttribute("y", cy - 40);
                t1.setAttribute("fill", "#e74c3c"); t1.setAttribute("font-weight", "bold");
                t1.setAttribute("opacity", op); t1.textContent = "δ+";
                svg.appendChild(t1);

                const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t2.setAttribute("x", x2); t2.setAttribute("y", cy - 40);
                t2.setAttribute("fill", "#e74c3c"); t2.setAttribute("font-weight", "bold");
                t2.setAttribute("opacity", op); t2.textContent = "δ-";
                svg.appendChild(t2);
            }

            if (obj.label) {
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", cx); t.setAttribute("y", cy + 50);
                t.setAttribute("text-anchor", "middle"); t.textContent = obj.label;
                svg.appendChild(t);
            }
        }

        init();

    </script>
