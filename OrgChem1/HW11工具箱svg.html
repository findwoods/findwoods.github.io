
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>有机化学“四维战场”控制台 (大字清晰版)</title>
    <style>
        :root {
            /* CPK 配色 (高对比度) */
            --c-atom: #374151; /* 碳: 深灰 */
            --h-atom: #94a3b8; /* 氢: 亮灰 */
            --o-atom: #dc2626; /* 氧: 鲜红 */
            --n-atom: #2563eb; /* 氮: 亮蓝 */
            --br-atom: #991b1b; /* 溴: 深红 */
            --i-atom: #7e22ce; /* 碘: 深紫 */
            --cl-atom: #16a34a; /* 氯: 鲜绿 */
            --f-atom: #eab308; /* 氟: 黄 */
            --e-pair: #f59e0b; /* 电子/箭头: 橙 */
            
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --primary-btn: #3b82f6;
        }
        
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 1200px;
            height: 850px;
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* 左侧导航 */
        .sidebar {
            width: 280px;
            background: #f1f5f9;
            border-right: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 25px;
            background: #1e293b;
            color: white;
        }
        .sidebar-header h2 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        
        .nav-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        
        .nav-category {
            font-size: 14px;
            font-weight: 900;
            color: #64748b;
            text-transform: uppercase;
            margin: 25px 0 10px 5px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 5px;
        }
        
        .nav-btn {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            margin-bottom: 8px;
            border: 2px solid transparent;
            background: #fff;
            color: #475569;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .nav-btn:hover { border-color: #cbd5e1; transform: translateX(3px); }
        .nav-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
        }

        /* 主视图 */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
        }
        
        .view-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }
        .view-header h1 { margin: 0; font-size: 28px; color: var(--text-main); }
        .tags .tag { 
            font-size: 13px; padding: 4px 12px; 
            border-radius: 15px; background: #e2e8f0; 
            color: #475569; font-weight: 800; margin-left: 8px; 
        }

        /* 舞台 */
        .stage {
            flex: 1;
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            /* 点阵背景 */
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 30px 30px;
        }
        
        svg { width: 100%; height: 100%; display: block; }

        /* === 动画核心样式 === */
        .atom-group { transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; }
        .atom-group:hover circle { stroke: #000; stroke-width: 2px; stroke-opacity: 0.3; }
        
        /* 大尺寸原子 */
        .atom-circle { stroke: rgba(0,0,0,0.1); stroke-width: 2px; }
        .atom-text { 
            font-family: Arial, Helvetica, sans-serif; 
            font-size: 22px; /* 字号加大 */
            font-weight: 900; 
            fill: white; 
            text-anchor: middle; 
            dominant-baseline: central; 
            pointer-events: none; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .bond { 
            stroke-width: 8; /* 键加粗 */
            stroke-linecap: round; 
            transition: all 0.8s ease; 
        }
        
        .electron-arrow { 
            fill: none; stroke: var(--e-pair); 
            stroke-width: 5; /* 箭头加粗 */
            stroke-dasharray: 10,5; 
            animation: flow 1s linear infinite; 
            opacity: 0; transition: opacity 0.3s; 
            marker-end: url(#arrowhead); 
        }
        @keyframes flow { to { stroke-dashoffset: -15; } }

        /* 信息栏 */
        .info-box {
            margin-top: 25px;
            background: #eff6ff;
            border-left: 6px solid var(--primary-btn);
            padding: 20px;
            border-radius: 8px;
            min-height: 110px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .step-title { font-size: 14px; color: var(--primary-btn); font-weight: 900; text-transform: uppercase; display: block; letter-spacing: 1px; margin-bottom: 8px; }
        .step-desc { font-size: 18px; line-height: 1.6; color: #1e293b; font-weight: 500; }
        .step-desc b { color: #2563eb; }

        /* 底部 */
        .controls { margin-top: 25px; display: flex; justify-content: space-between; align-items: center; }
        .legend { display: flex; gap: 15px; font-size: 14px; font-weight: bold; color: #64748b; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.1); }

        .btn-main {
            padding: 15px 40px;
            background: var(--primary-btn);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-main:active { transform: scale(0.98); }
        .btn-main.reset { background: #10b981; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4); }

        /* 原子颜色映射 */
        .atom-c circle { fill: var(--c-atom); }
        .atom-h circle { fill: var(--h-atom); }
        .atom-h text { fill: #334155; text-shadow: none; } /* 氢原子背景亮，文字用深色 */
        .atom-o circle { fill: var(--o-atom); }
        .atom-br circle { fill: var(--br-atom); }
        .atom-i circle { fill: var(--i-atom); }
        .atom-cl circle { fill: var(--cl-atom); }
        .atom-f circle { fill: var(--f-atom); } .atom-f text { fill: #333; text-shadow: none; }
        .atom-n circle { fill: var(--n-atom); }

    </style>
</head>
<body>

<div class="app-container">
    <!-- 侧边菜单 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>化学战场控制台</h2>
        </div>
        <div class="nav-scroll">
            <div class="nav-category">Part 1: 核心兵器</div>
            <button class="nav-btn" onclick="loadTool('t1')">1.1 α-碳结构 (底物)</button>
            <button class="nav-btn" onclick="loadTool('t2')">1.2 离去基团 (LG)</button>
            <button class="nav-btn" onclick="loadTool('t3')">2.1 亲核性 vs 碱性</button>
            <button class="nav-btn" onclick="loadTool('t4')">3.1 溶剂效应</button>
            
            <div class="nav-category">Part 2: 四大战役</div>
            <button class="nav-btn" onclick="loadTool('sn2')">4.1 SN2 机理 (协同)</button>
            <button class="nav-btn" onclick="loadTool('sn1')">4.2 SN1 机理 (分步)</button>
            <button class="nav-btn" onclick="loadTool('e2')">4.3 E2 机理 (反式)</button>
            <button class="nav-btn" onclick="loadTool('e1')">4.4 E1 机理 (热力学)</button>

            <div class="nav-category">Part 3: 实战任务</div>
            <button class="nav-btn" onclick="loadTool('task1')">任务一: 预测产物</button>
            <button class="nav-btn" onclick="loadTool('task3')">任务三: 重排陷阱</button>
        </div>
    </div>

    <!-- 主界面 -->
    <div class="main-view">
        <div class="view-header">
            <h1 id="tool-title">加载中...</h1>
            <div class="tags" id="tool-tags"></div>
        </div>

        <div class="stage">
            <svg id="canvas" viewBox="0 0 900 500">
                <defs>
                    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                        <path d="M0,0 L6,3 L0,6" fill="#f59e0b" />
                    </marker>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>
            </svg>
        </div>

        <div class="info-box">
            <span class="step-title" id="step-title">STEP 0</span>
            <div class="step-desc" id="step-desc">欢迎来到化学战场。请选择左侧工具开始。</div>
        </div>

        <div class="controls">
            <div class="legend">
                <div class="legend-item"><span class="dot" style="background:var(--c-atom)"></span>C</div>
                <div class="legend-item"><span class="dot" style="background:var(--h-atom)"></span>H</div>
                <div class="legend-item"><span class="dot" style="background:var(--br-atom)"></span>Br/I</div>
                <div class="legend-item"><span class="dot" style="background:var(--o-atom)"></span>O</div>
                <div class="legend-item"><span class="dot" style="background:var(--n-atom)"></span>N</div>
            </div>
            <button id="btn-next" class="btn-main" onclick="nextStep()">▶ 播放第一步</button>
        </div>
    </div>
</div>

<script>
    // === 高可见度绘图引擎 ===
    const svg = document.getElementById('canvas');
    const svgNS = "http://www.w3.org/2000/svg";

    const Engine = {
        clear: () => {
            const defs = svg.querySelector('defs').outerHTML;
            svg.innerHTML = defs;
        },
        
        // r=32 (直径64px) -> 巨大的原子
        atom: (id, x, y, type, label, r=40) => {
            const g = document.createElementNS(svgNS, 'g');
            g.setAttribute('id', id);
            g.setAttribute('class', `atom-group atom-${type.toLowerCase()}`);
            g.setAttribute('transform', `translate(${x},${y})`);
            
            const c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('r', r);
            c.setAttribute('class', 'atom-circle');
            
            const t = document.createElementNS(svgNS, 'text');
            t.setAttribute('class', 'atom-text');
            
            // 处理下标 (如 CH3)
            if (label.match(/\d/)) {
                const parts = label.split(/(\d)/);
                parts.forEach((p, i) => {
                    const tsp = document.createElementNS(svgNS, 'tspan');
                    tsp.textContent = p;
                    // 下标位置微调
                    if (p.match(/\d/)) {
                        tsp.setAttribute('dy', '8'); 
                        tsp.setAttribute('font-size', '16px');
                    } else if (i > 0) {
                        tsp.setAttribute('dy', '-8');
                    }
                    t.appendChild(tsp);
                });
            } else {
                t.textContent = label;
            }

            g.appendChild(c);
            g.appendChild(t);
            svg.appendChild(g); // 原子必须在键的上方
            return g;
        },

        // 键宽默认 8px
        bond: (id, x1, y1, x2, y2, color='#cbd5e1', width=8) => {
            const l = document.createElementNS(svgNS, 'line');
            l.setAttribute('id', id);
            l.setAttribute('class', 'bond');
            l.setAttribute('x1', x1); l.setAttribute('y1', y1);
            l.setAttribute('x2', x2); l.setAttribute('y2', y2);
            l.setAttribute('stroke', color);
            l.setAttribute('stroke-width', width);
            // 插入到defs之后 (确保键在原子下方)
            svg.insertBefore(l, svg.children[1]);
        },

        arrow: (id, d) => {
            const p = document.createElementNS(svgNS, 'path');
            p.setAttribute('id', id);
            p.setAttribute('class', 'electron-arrow');
            p.setAttribute('d', d);
            svg.appendChild(p);
        },
        
        // 辅助文字
        label: (id, x, y, text, color='#333') => {
             const t = document.createElementNS(svgNS, 'text');
             t.setAttribute('id', id);
             t.setAttribute('x', x); t.setAttribute('y', y);
             t.setAttribute('fill', color);
             t.setAttribute('font-size', '24'); // 更大的辅助文字
             t.setAttribute('font-weight', 'bold');
             t.setAttribute('text-anchor', 'middle');
             t.textContent = text;
             svg.appendChild(t);
        },

        // 动画方法
        move: (id, x, y) => {
            const el = document.getElementById(id);
            if(el) el.setAttribute('transform', `translate(${x},${y})`);
        },
        
        style: (id, props) => {
            const el = document.getElementById(id);
            if(!el) return;
            if(props.opacity !== undefined) el.style.opacity = props.opacity;
            if(props.text && el.tagName === 'text') el.textContent = props.text;
            
            // 线条更新
            if(el.tagName === 'line') {
                if(props.x1) el.setAttribute('x1', props.x1);
                if(props.y1) el.setAttribute('y1', props.y1);
                if(props.x2) el.setAttribute('x2', props.x2);
                if(props.y2) el.setAttribute('y2', props.y2);
                if(props.color) el.setAttribute('stroke', props.color);
                if(props.width) el.setAttribute('stroke-width', props.width);
            }
            
            // 原子类型/标签更新
            if(props.type) el.setAttribute('class', `atom-group atom-${props.type.toLowerCase()}`);
            if(props.label) {
                const t = el.querySelector('text');
                t.innerHTML = ''; 
                t.textContent = props.label; 
                // 这里简单处理，如果需要下标动态更新需重写逻辑，暂忽略
            }
        }
    };

    // === 教学数据 ===
    const Data = {
        // --- 工具箱 ---
        't1': {
            title: "1.1 α-碳结构与位阻", tags: ["底物", "空间效应"],
            steps: [
                {
                    t: "甲基 (Methyl)", 
                    d: "<b>结构：</b>CH₃-Br (无碳连接)。<br>空间极为空旷，原子如同在旷野。亲核试剂可随意进攻。<br>结论：<b>SN2 极快</b>。",
                    setup: (E) => {
                        E.clear();
                        // 放大间距以适应大原子
                        E.atom('c', 450, 250, 'c', 'C');
                        E.bond('b', 450, 250, 580, 250, '#991b1b'); E.atom('lg', 580, 250, 'br', 'Br');
                        E.bond('h1', 450, 250, 380, 150); E.atom('ah1', 380, 150, 'h', 'H');
                        E.bond('h2', 450, 250, 380, 350); E.atom('ah2', 380, 350, 'h', 'H');
                        E.bond('h3', 450, 250, 320, 250); E.atom('ah3', 320, 250, 'h', 'H');
                    }
                },
                {
                    t: "伯碳 (1° Primary)", 
                    d: "<b>结构：</b>CH₃CH₂-Br (连1个碳)。<br>背面稍有遮挡，但仍然很通畅。<br>结论：<b>SN2 首选</b>。",
                    action: (E) => {
                        E.style('ah3', {type: 'c', label: 'CH3'}); // 变身
                        E.move('ah3', 280, 250); // 移远一点
                    }
                },
                {
                    t: "仲碳 (2° Secondary)", 
                    d: "<b>结构：</b>(CH₃)₂CH-Br (连2个碳)。<br>这是一个<b>十字路口</b>。有些挤了。<br>结论：SN1/SN2/E1/E2 都有可能，看造化。",
                    action: (E) => {
                        E.style('ah1', {type: 'c', label: 'CH3'});
                        E.move('ah1', 350, 120);
                    }
                },
                {
                    t: "叔碳 (3° Tertiary)", 
                    d: "<b>结构：</b>(CH₃)₃C-Br (连3个碳)。<br><b>堡垒！</b>背面完全封死。亲核试剂进不来。<br>结论：<b>SN2 绝无可能</b>。只能走 SN1/E1/E2。",
                    action: (E) => {
                        E.style('ah2', {type: 'c', label: 'CH3'});
                        E.move('ah2', 350, 380);
                    }
                }
            ]
        },
        't2': {
            title: "1.2 离去基团 (LG)", tags: ["酸碱性", "pKa"],
            steps: [
                {
                    t: "好离去基团 (Good LG)",
                    d: "<b>代表：</b>碘离子 (I⁻)。<br>它的共轭酸 HI 是强酸。所以 I⁻ 是<b>弱碱</b>，非常稳定，想走就走。",
                    setup: (E) => {
                        E.clear();
                        E.atom('c', 350, 250, 'c', 'C');
                        E.bond('b', 350, 250, 500, 250, '#7e22ce', 6);
                        E.atom('lg', 500, 250, 'i', 'I');
                        E.label('l1', 500, 150, "稳定 (Happy)", '#7e22ce');
                    }
                },
                {
                    t: "差离去基团 (Bad LG)",
                    d: "<b>代表：</b>氢氧根 (OH⁻)。<br>它的共轭酸 H₂O 是弱酸。所以 OH⁻ 是<b>强碱</b>，不稳定，死赖着不走。",
                    action: (E) => {
                        E.style('lg', {type: 'o', label: 'OH'});
                        E.style('b', {color: '#dc2626', width: 12}); // 粗键表示难断
                        E.style('l1', {text: "不稳定 (Angry)", fill: '#dc2626'});
                    }
                },
                {
                    t: "活化 (Activation)",
                    d: "<b>策略：</b>加酸质子化。<br>变成 H₂O⁺ (水)。水是好离去基团。现在可以反应了！",
                    action: (E) => {
                        E.atom('h', 500, 100, 'h', 'H⁺');
                        E.arrow('a', "M 500 120 L 500 190");
                        E.style('a', {opacity: 1});
                        setTimeout(()=>{
                            E.style('a', {opacity:0}); E.style('h', {opacity:0});
                            E.style('lg', {label: 'H2O', type: 'o'}); // Water
                            E.style('b', {color: '#cbd5e1', width: 6}); // 键变弱
                            E.style('l1', {text: "活化成功 (Ready)", fill: '#16a34a'});
                        }, 800);
                    }
                }
            ]
        },
        
        // --- 机理演示 ---
        'sn2': {
            title: "4.1 SN2 机理", tags: ["协同反应", "翻转"],
            steps: [
                {t: "准备", d: "1° 溴代烷 + 强亲核试剂 (CN⁻)。<br>CN⁻ 瞄准碳的背面。", setup: (E)=>{
                    E.clear();
                    E.atom('c', 450, 250, 'c', 'C');
                    E.bond('lg', 450, 250, 580, 250, '#991b1b'); E.atom('br', 580, 250, 'br', 'Br');
                    // H groups
                    E.bond('h1', 450, 250, 380, 160); E.atom('ah1', 380, 160, 'h', 'H');
                    E.bond('h2', 450, 250, 380, 340); E.atom('ah2', 380, 340, 'h', 'H');
                    E.bond('h3', 450, 250, 350, 250); E.atom('ah3', 350, 250, 'h', 'H');
                    // Nu
                    E.atom('nu', 150, 250, 'c', 'CN⁻');
                }},
                {t: "过渡态", d: "CN⁻ 撞击！C-Br 键断裂。<br>三个 H 被挤平，形成平面五配位结构。", action: (E)=>{
                    E.move('nu', 330, 250);
                    E.bond('bnu', 330, 250, 450, 250, '#3b82f6', 4); // 虚键
                    E.move('br', 620, 250); E.style('lg', {opacity: 0.5}); // 键断裂
                    // Flatten
                    E.move('ah1', 450, 130); E.style('h1', {x2:450, y2:130});
                    E.move('ah2', 450, 370); E.style('h2', {x2:450, y2:370});
                    E.move('ah3', 450, 200); E.style('h3', {x2:450, y2:200, opacity:0.5});
                }},
                {t: "翻转完成", d: "Br⁻ 滚蛋，C-CN 键生成。<br>构型完全翻转，像雨伞翻过来一样。", action: (E)=>{
                    E.move('nu', 380, 250); E.style('bnu', {x1:380, width:8});
                    E.move('br', 750, 250); E.style('lg', {opacity: 0});
                    // Invert
                    E.move('ah1', 520, 160); E.style('h1', {x2:520, y2:160});
                    E.move('ah2', 520, 340); E.style('h2', {x2:520, y2:340});
                    E.move('ah3', 550, 250); E.style('h3', {x2:550, y2:250, opacity:1});
                }}
            ]
        },
        'e2': {
            title: "4.3 E2 机理", tags: ["反式消除", "强碱"],
            steps: [
                {t: "反式共平面", d: "必须姿势：H 和 Br 处于反向 (180°)。<br>强碱 (EtO⁻) 靠近 β-H。", setup: (E)=>{
                    E.clear();
                    E.atom('ca', 500, 250, 'c', 'Cα');
                    E.atom('cb', 350, 250, 'c', 'Cβ');
                    E.bond('cc', 350, 250, 500, 250);
                    // Br Down
                    E.bond('bbr', 500, 250, 500, 380, '#991b1b'); E.atom('br', 500, 380, 'br', 'Br');
                    // H Up
                    E.bond('bh', 350, 250, 350, 120); E.atom('h', 350, 120, 'h', 'H');
                    // Base
                    E.atom('base', 200, 80, 'o', 'EtO⁻');
                }},
                {t: "协同反应", d: "三位一体：碱抓H，电子倒下，挤走Br。<br>这就是“协同”的意思。", action: (E)=>{
                    E.arrow('a1', "M 220 90 Q 280 80 330 110"); // Base -> H
                    E.arrow('a2', "M 350 160 Q 425 160 425 230"); // Bond -> CC
                    E.arrow('a3', "M 500 280 Q 540 320 510 360"); // Bond -> Br
                    E.style('a1',{opacity:1}); E.style('a2',{opacity:1}); E.style('a3',{opacity:1});
                    E.move('base', 300, 90);
                }},
                {t: "生成烯烃", d: "H被抓走，Br离去，中间形成 C=C 双键。", action: (E)=>{
                    E.style('a1',{opacity:0}); E.style('a2',{opacity:0}); E.style('a3',{opacity:0});
                    E.move('h', 270, 100); E.style('bh', {opacity:0}); // H joins base
                    E.move('br', 500, 450); E.style('bbr', {opacity:0}); // Br leaves
                    E.style('cc', {color: '#f59e0b', width: 16}); // Double Bond visual
                }}
            ]
        },
        'task3': {
            title: "任务三: 重排陷阱", tags: ["碳正离子", "1,2-迁移"],
            steps: [
                {t: "初始困境", d: "SN1 第一步后，产生了一个 <b>2° 碳正离子</b>。<br>它很不开心，因为它不够稳定。", setup: (E)=>{
                    E.clear();
                    // 2 degree C+
                    E.atom('c2', 500, 250, 'c', 'C⁺(2°)');
                    E.bond('h', 500, 250, 500, 350); E.atom('h', 500, 350, 'h', 'H');
                    // Neighbor 4 degree
                    E.bond('cc', 500, 250, 300, 250); E.atom('c4', 300, 250, 'c', 'C');
                    E.bond('m1', 300, 250, 230, 150); E.atom('am1', 230, 150, 'c', 'CH3');
                    E.bond('m2', 300, 250, 230, 350); E.atom('am2', 230, 350, 'c', 'CH3');
                    E.bond('m_mv', 300, 250, 300, 150); E.atom('am_mv', 300, 150, 'c', 'CH3');
                }},
                {t: "甲基迁移", d: "邻居伸出援手！<br>一个甲基 (CH3) 带着电子跳了过来 (1,2-迁移)。", action: (E)=>{
                    E.arrow('mv', "M 320 160 Q 400 120 480 230");
                    E.style('mv', {opacity: 1});
                    setTimeout(()=>{
                        E.style('mv', {opacity: 0});
                        E.move('am_mv', 500, 150); // Move Methyl visually
                        E.style('m_mv', {x1:500, y1:250, x2:500, y2:150}); // Update bond
                        
                        // Update charges
                        E.style('c2', {label: 'C', type: 'c'}); // Neutral
                        E.style('c4', {label: 'C⁺(3°)', type: 'o'}); // New C+ (Red color for emphasis)
                    }, 800);
                }},
                {t: "皆大欢喜", d: "现在我们得到了一个 <b>3° 碳正离子</b>。<br>它非常稳定。反应将从这里继续进行。", action: (E)=>{
                     E.label('res', 400, 400, "更稳定的中间体！", '#16a34a');
                }}
            ]
        }
    };
    
    // 补充占位数据以防报错
    ['t3','t4','sn1','e1','task1'].forEach(k => {
        if(!Data[k]) Data[k] = Data['sn2']; 
    });

    // === 控制器 ===
    let currentTool = null;
    let stepIndex = 0;
    const UI = {
        title: document.getElementById('tool-title'),
        tags: document.getElementById('tool-tags'),
        stepTitle: document.getElementById('step-title'),
        stepDesc: document.getElementById('step-desc'),
        btn: document.getElementById('btn-next')
    };

    function loadTool(key) {
        currentTool = Data[key];
        stepIndex = 0;
        
        // UI 更新
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[onclick="loadTool('${key}')"]`)?.classList.add('active');
        
        UI.title.textContent = currentTool.title;
        UI.tags.innerHTML = currentTool.tags.map(t => `<span class="tag">${t}</span>`).join('');
        
        runStep(0);
    }

    function runStep(idx) {
        const step = currentTool.steps[idx];
        UI.stepTitle.textContent = step.t;
        UI.stepDesc.innerHTML = step.d;
        
        if(idx === 0 && step.setup) step.setup(Engine);
        if(idx > 0 && step.action) step.action(Engine);
        
        if(idx === currentTool.steps.length - 1) {
            UI.btn.innerHTML = "↺ 重置演示";
            UI.btn.classList.add('reset');
        } else {
            UI.btn.innerHTML = "▶ 下一步";
            UI.btn.classList.remove('reset');
        }
    }

    function nextStep() {
        if (stepIndex >= currentTool.steps.length - 1) {
            stepIndex = 0;
        } else {
            stepIndex++;
        }
        runStep(stepIndex);
    }

    // 启动
    loadTool('t1');

</script>
</body>
</html>
