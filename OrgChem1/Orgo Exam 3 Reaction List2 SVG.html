                        atoms: [
                            {id:1, el:'C', x:200, y:200}, {id:2, el:'C', x:300, y:200, lbl:'C:-'},
                            {id:5, el:'C', x:100, y:200, lbl:'R'},
                            {id:6, el:'N', x:450, y:100, lbl:'NH3'}, // Byproduct
                            {id:7, el:'C', x:500, y:200, lbl:'C'}, {id:8, el:'Br', x:580, y:200, lbl:'Br'}, {id:9, el:'C', x:500, y:280, lbl:'Pr'} // Alkyl halide
                        ],
                        bonds: [[1,2,3], [1,5], [7,8], [7,9]]
                    },
                    {
                        title: 'SN2 进攻',
                        desc: '炔碳负离子背面进攻一级卤代烷，Br- 离去。形成新的 C-C 键。',
                        atoms: [
                            {id:1, el:'C', x:200, y:200}, {id:2, el:'C', x:300, y:200},
                            {id:5, el:'C', x:100, y:200, lbl:'R'},
                            {id:7, el:'C', x:400, y:200, lbl:'C'}, {id:9, el:'C', x:480, y:200, lbl:'Pr'},
                            {id:8, el:'Br', x:650, y:200, lbl:'Br-'} // Leaving group
                        ],
                        bonds: [[1,2,3], [1,5], [2,7], [7,9]] // New bond 2-7
                    }
                ]
            }
        ]
    }
];

/* ================= 逻辑控制类 ================= */

class ChemistryTool {
    constructor(data) {
        this.data = data;
        this.currentExampleIdx = 0;
        this.currentStepIdx = 0;
        this.render();
    }

    get currentExample() { return this.data.examples[this.currentExampleIdx]; }
    get currentStep() { return this.currentExample.steps[this.currentStepIdx]; }

    render() {
        const container = document.createElement('div');
        container.className = 'tool-card';
        container.innerHTML = `
            <div class="card-header">
                <span class="card-title">${this.data.title}</span>
                <span class="card-tag">${this.data.tag}</span>
            </div>
            <div class="example-tabs">
                ${this.data.examples.map((ex, i) => `
                    <button class="tab-btn ${i === 0 ? 'active' : ''}" onclick="tools['${this.data.id}'].switchExample(${i}, this)">
                        ${ex.name}
                    </button>
                `).join('')}
            </div>
            <div class="viz-area">
                <svg id="svg-${this.data.id}" viewBox="0 0 800 400"></svg>
            </div>
            <div class="control-panel">
                <div class="step-info">
                    <span class="step-title" id="title-${this.data.id}"></span>
                    <div class="step-desc" id="desc-${this.data.id}"></div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-reset" onclick="tools['${this.data.id}'].reset()">↺ 重置</button>
                    <button class="btn btn-next" onclick="tools['${this.data.id}'].nextStep()">▶ 下一步</button>
                </div>
            </div>
        `;
        document.getElementById('tools-container').appendChild(container);
        
        this.updateVisuals();
    }

    switchExample(idx, btnEl) {
        this.currentExampleIdx = idx;
        this.currentStepIdx = 0;
        
        const parent = btnEl.parentElement;
        Array.from(parent.children).forEach(c => c.classList.remove('active'));
        btnEl.classList.add('active');

        this.updateVisuals();
    }

    reset() {
        this.currentStepIdx = 0;
        this.updateVisuals();
    }

    nextStep() {
        if (this.currentStepIdx < this.currentExample.steps.length - 1) {
            this.currentStepIdx++;
            this.updateVisuals();
        } else {
            this.currentStepIdx = 0; // Loop
            this.updateVisuals();
        }
    }

    updateVisuals() {
        const svg = document.getElementById(`svg-${this.data.id}`);
        const stepData = this.currentStep;
        const totalSteps = this.currentExample.steps.length;

        // 1. 更新文字
        document.getElementById(`title-${this.data.id}`).innerText = 
            `步骤 ${this.currentStepIdx + 1}/${totalSteps}: ${stepData.title}`;
        document.getElementById(`desc-${this.data.id}`).innerText = stepData.desc;

        // 2. 渲染键 (Bonds)
        let bondGroup = svg.querySelector('.bonds-layer');
        if (!bondGroup) {
            bondGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            bondGroup.setAttribute("class", "bonds-layer");
            svg.appendChild(bondGroup);
        }

        const presentBondIds = new Set();

        stepData.bonds.forEach(bond => {
            const id1 = bond[0];
            const id2 = bond[1];
            const type = bond[2] || 1; 
            const bondId = `bond-${Math.min(id1,id2)}-${Math.max(id1,id2)}`;
            presentBondIds.add(bondId);

            const atom1 = stepData.atoms.find(a => a.id === id1);
            const atom2 = stepData.atoms.find(a => a.id === id2);

            if (atom1 && atom2) {
                let line = document.getElementById(`${this.data.id}-${bondId}`);
                if (!line) {
                    line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("id", `${this.data.id}-${bondId}`);
                    line.setAttribute("class", "bond-line");
                    bondGroup.appendChild(line);
                }

                line.setAttribute("x1", atom1.x);
                line.setAttribute("y1", atom1.y);
                line.setAttribute("x2", atom2.x);
                line.setAttribute("y2", atom2.y);
                
                // 键类型样式
                line.classList.remove('bond-double', 'bond-triple');
                if (type === 2) {
                    line.classList.add('bond-double');
                } else if (type === 3) {
                    line.classList.add('bond-triple');
                }
                line.style.opacity = 1;
            }
        });

        Array.from(bondGroup.children).forEach(line => {
            const rawId = line.id.replace(`${this.data.id}-`, '');
            if (!presentBondIds.has(rawId)) {
                line.style.opacity = 0;
            }
        });

        // 3. 渲染原子 (Atoms)
        let atomLayer = svg.querySelector('.atoms-layer');
        if (!atomLayer) {
            atomLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
            atomLayer.setAttribute("class", "atoms-layer");
            svg.appendChild(atomLayer);
        }

        const presentAtomIds = new Set();

        stepData.atoms.forEach(atom => {
            const domId = `${this.data.id}-atom-${atom.id}`;
            presentAtomIds.add(domId);
            let g = document.getElementById(domId);

            if (!g) {
                g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("id", domId);
                g.setAttribute("class", "atom-group");
                
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("r", ATOM_R);
                circle.setAttribute("class", "atom-circle");
                g.appendChild(circle);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("class", "atom-label");
                g.appendChild(text);

                atomLayer.appendChild(g);
            }

            g.style.transform = `translate(${atom.x}px, ${atom.y}px)`;
            g.style.opacity = (atom.op !== undefined) ? atom.op : 1;

            const circle = g.querySelector('.atom-circle');
            circle.style.fill = ELEMENT_COLORS[atom.el] || '#999';
            
            const text = g.querySelector('.atom-label');
            text.textContent = atom.lbl || atom.el;
            text.style.fontSize = (text.textContent.length > 2) ? '16px' : '20px';
        });

        Array.from(atomLayer.children).forEach(g => {
            if (!presentAtomIds.has(g.id)) {
                g.style.opacity = 0;
            }
        });
    }
}

// 初始化工具
const tools = {};
TOOLS_DATA.forEach(data => {
    tools[data.id] = new ChemistryTool(data);
});

</script>
</body>
