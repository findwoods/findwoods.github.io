<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part1 I.1 - 结构推断 (化合物A和B)</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0fdf4 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '🔬';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #f0fdf4);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔬 Part1 I.1 - 结构推断</h1>

        <div class="card">
            <h2>题目数据</h2>
            <div class="explanation">
                <strong>分子式:</strong> C₆H₁₀<br>
                <strong>IR:</strong> 无宽峰 (无OH/NH)<br>
                <strong>¹H NMR:</strong> 1.63 ppm (s, 6H), 2.22 ppm (s, 4H)<br>
                <strong>催化加氢:</strong> 吸收1 equiv H₂<br>
                <strong>臭氧分解:</strong> 生成化合物B (C₆H₁₀O₂)
            </div>
        </div>

        <div class="card">
            <h2>工具1: 不饱和度计算</h2>
            <div class="svg-container">
                <svg id="svg-u1" width="650" height="120" viewBox="0 0 650 120">
                    <g id="u1-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">C₆H₁₀
                            不饱和度计算</text>
                        <text x="325" y="75" text-anchor="middle" fill="#1e293b" font-size="12">U = (2×6 + 2 - 10)/2 =
                            <tspan font-weight="bold" fill="#16a34a">2</tspan> → 可能是1个环 + 1个双键</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('u1')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具2: NMR分析</h2>
            <div class="svg-container">
                <svg id="svg-nmr1" width="650" height="150" viewBox="0 0 650 150">
                    <g id="nmr1-step1" opacity="0">
                        <rect x="30" y="20" width="280" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="170" y="50" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">1.63
                            ppm (s, 6H)</text>
                        <text x="170" y="75" text-anchor="middle" fill="#1e293b" font-size="11">2个等价的CH₃</text>
                        <text x="170" y="95" text-anchor="middle" fill="#64748b" font-size="10">单峰=无邻位H偶合</text>

                        <rect x="340" y="20" width="280" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="480" y="50" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">2.22
                            ppm (s, 4H)</text>
                        <text x="480" y="75" text-anchor="middle" fill="#1e293b" font-size="11">2个等价的CH₂</text>
                        <text x="480" y="95" text-anchor="middle" fill="#64748b" font-size="10">单峰=无邻位H偶合</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('nmr1')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具3: 结构推断</h2>
            <div class="svg-container">
                <svg id="svg-str1" width="650" height="180" viewBox="0 0 650 180">
                    <g id="str1-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="140" rx="15" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#db2777" font-size="14" font-weight="bold">化合物A:
                            1,2-二甲基环丁烯</text>

                        <text x="60" y="85" fill="#1e293b" font-size="11">• 四元环 (环丁烯) 提供1个环 + 1个双键 = U=2 ✓</text>
                        <text x="60" y="110" fill="#1e293b" font-size="11">• 2个甲基在双键碳上 → 6H单峰 ✓</text>
                        <text x="60" y="135" fill="#1e293b" font-size="11">• 2个CH₂在环上 → 4H单峰 ✓</text>

                        <text x="500" y="100" text-anchor="middle" fill="#16a34a" font-size="16"
                            font-weight="bold">✓</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('str1')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具4: 臭氧分解得B</h2>
            <div class="svg-container">
                <svg id="svg-oz1" width="650" height="130" viewBox="0 0 650 130">
                    <g id="oz1-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="90" rx="10" fill="#ecfeff" stroke="#0891b2"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#0891b2" font-size="13"
                            font-weight="bold">臭氧分解反应</text>
                        <text x="325" y="80" text-anchor="middle" fill="#1e293b" font-size="12">A (C₆H₁₀) + O₃ → B:
                            <tspan font-weight="bold" fill="#db2777">2,5-己二酮</tspan> CH₃-CO-CH₂-CH₂-CO-CH₃</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('oz1')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 最终答案</h2>
            <div class="answer-box">
                <p><strong>化合物A:</strong> 1,2-二甲基环丁烯 (1,2-Dimethylcyclobutene)</p>
                <p><strong>化合物B:</strong> 2,5-己二酮 (2,5-Hexanedione)</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
