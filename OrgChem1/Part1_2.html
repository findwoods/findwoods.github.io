<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part1 I.2 - 碳谱与对称性推断</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #ecfeff 0%, #fdf4ff 50%, #f0fdf4 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '🔬';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔬 Part1 I.2 - 碳谱与对称性推断</h1>

        <div class="card">
            <h2>题目数据</h2>
            <div class="explanation">
                <strong>分子式:</strong> C₈H₁₂<br>
                <strong>¹³C NMR:</strong> 只有2个峰 (高度对称!)<br>
                <strong>催化加氢:</strong> 吸收2 equiv H₂ → 生成环辛烷 (D)<br>
                <strong>臭氧分解:</strong> 生成化合物E
            </div>
        </div>

        <div class="card">
            <h2>工具1: 不饱和度计算</h2>
            <div class="svg-container">
                <svg id="svg-u2" width="650" height="120" viewBox="0 0 650 120">
                    <g id="u2-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">C₈H₁₂
                            不饱和度计算</text>
                        <text x="325" y="75" text-anchor="middle" fill="#1e293b" font-size="12">U = (2×8 + 2 - 12)/2 =
                            <tspan font-weight="bold" fill="#16a34a">3</tspan> → 1个环 + 2个双键</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('u2')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具2: 加氢分析</h2>
            <div class="svg-container">
                <svg id="svg-h2" width="650" height="130" viewBox="0 0 650 130">
                    <g id="h2-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#16a34a" font-size="13"
                            font-weight="bold">加氢分析</text>
                        <text x="325" y="80" text-anchor="middle" fill="#1e293b" font-size="12">吸收2 equiv H₂ → 有2个双键 |
                            产物环辛烷 → C是8元环</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('h2')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具3: 对称性分析</h2>
            <div class="svg-container">
                <svg id="svg-sym" width="650" height="150" viewBox="0 0 650 150">
                    <g id="sym-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="110" rx="10" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#db2777" font-size="13" font-weight="bold">¹³C
                            NMR只有2个峰 → 高度对称!</text>
                        <text x="60" y="85" fill="#1e293b" font-size="11">• 8个碳只有2种化学环境</text>
                        <text x="60" y="110" fill="#1e293b" font-size="11">• 结构: <tspan font-weight="bold"
                                fill="#16a34a">1,5-环辛二烯</tspan> (两个双键对称分布)</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('sym')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具4: 臭氧分解得E</h2>
            <div class="svg-container">
                <svg id="svg-oz2" width="650" height="120" viewBox="0 0 650 120">
                    <g id="oz2-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="80" rx="10" fill="#ecfeff" stroke="#0891b2"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#0891b2" font-size="13"
                            font-weight="bold">臭氧分解</text>
                        <text x="325" y="80" text-anchor="middle" fill="#1e293b" font-size="12">C (1,5-环辛二烯) + O₃ → E:
                            <tspan font-weight="bold" fill="#db2777">丁二醛</tspan> OHC-CH₂-CH₂-CHO</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('oz2')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 最终答案</h2>
            <div class="answer-box">
                <p><strong>化合物C:</strong> 1,5-环辛二烯 (1,5-Cyclooctadiene)</p>
                <p><strong>化合物D:</strong> 环辛烷 (Cyclooctane)</p>
                <p><strong>化合物E:</strong> 丁二醛 (Butanedial) × 2分子</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
