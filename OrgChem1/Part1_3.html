<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part1 I.3 - NMR谱图绘制</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fce7f3 50%, #dbeafe 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '📊';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 Part1 I.3 - NMR谱图绘制</h1>

        <div class="card">
            <h2>分子结构</h2>
            <div class="explanation">
                <strong>分子:</strong> CH₃-C(=O)-CH₂-CH=CH-Cl<br>
                <strong>任务:</strong> 预测¹H NMR谱图
            </div>
        </div>

        <div class="card">
            <h2>工具1: 质子分类</h2>
            <div class="svg-container">
                <svg id="svg-p1" width="650" height="180" viewBox="0 0 650 180">
                    <g id="p1-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#16a34a" font-size="13"
                            font-weight="bold">四类质子</text>

                        <text x="60" y="85" fill="#dc2626" font-size="11" font-weight="bold">Ha: CH₃ (3H)</text>
                        <text x="200" y="85" fill="#1e293b" font-size="10">连着C=O，无邻位H → 单峰</text>

                        <text x="60" y="110" fill="#f59e0b" font-size="11" font-weight="bold">Hb: CH₂ (2H)</text>
                        <text x="200" y="110" fill="#1e293b" font-size="10">被Hc偶合 → 双峰</text>

                        <text x="60" y="135" fill="#2563eb" font-size="11" font-weight="bold">Hc: =CH- (1H)</text>
                        <text x="200" y="135" fill="#1e293b" font-size="10">被Hb(2H)和Hd(1H)偶合 → dt</text>

                        <text x="400" y="135" fill="#db2777" font-size="11" font-weight="bold">Hd: =CH-Cl (1H)</text>
                        <text x="520" y="135" fill="#1e293b" font-size="10">被Hc偶合 → 双峰</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('p1')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具2: NMR峰预测</h2>
            <div class="svg-container">
                <svg id="svg-nmr3" width="650" height="200" viewBox="0 0 650 200">
                    <g id="nmr3-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="160" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">¹H
                            NMR信号预测</text>

                        <text x="60" y="85" fill="#1e293b" font-size="11">Ha (~2.1 ppm): <tspan font-weight="bold">单峰 3H
                            </tspan> - 酮旁CH₃</text>
                        <text x="60" y="110" fill="#1e293b" font-size="11">Hb (~3.2 ppm): <tspan font-weight="bold">双峰
                                2H</tspan> - 亚甲基</text>
                        <text x="60" y="135" fill="#1e293b" font-size="11">Hc (~6.0 ppm): <tspan font-weight="bold">dt
                                1H</tspan> - 烯烃H (被2+1个H偶合)</text>
                        <text x="60" y="160" fill="#1e293b" font-size="11">Hd (~6.3 ppm): <tspan font-weight="bold">双峰
                                1H</tspan> - Cl旁烯烃H</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('nmr3')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 裂分规律</h2>
            <div class="answer-box">
                <p><strong>n+1规则:</strong> 被n个邻位H偶合 → 裂分成n+1个峰</p>
                <p><strong>Hc的dt:</strong> doublet of triplets (d×t) = 被1个Hd裂分成2峰，每峰再被2个Hb裂分成3峰</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
