<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part1 I.4 - 简单结构推断</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 50%, #fef3c7 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '🔬';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #f0fdf4);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔬 Part1 I.4 - 简单结构推断</h1>

        <div class="card">
            <h2>题目数据</h2>
            <div class="explanation">
                <strong>分子式:</strong> C₄H₉I<br>
                <strong>¹H NMR:</strong><br>
                • 1.03 ppm (d, 6H) - 双峰<br>
                • 1.72 ppm (nonet, 1H) - 九重峰<br>
                • 3.16 ppm (d, 2H) - 双峰
            </div>
        </div>

        <div class="card">
            <h2>工具1: NMR数据分析</h2>
            <div class="svg-container">
                <svg id="svg-nmr4" width="650" height="180" viewBox="0 0 650 180">
                    <g id="nmr4-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="140" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#2563eb" font-size="13"
                            font-weight="bold">NMR信号解读</text>

                        <text x="60" y="85" fill="#16a34a" font-size="11" font-weight="bold">1.03 ppm (d, 6H):</text>
                        <text x="230" y="85" fill="#1e293b" font-size="10">2个等价CH₃，被1个H偶合 → (CH₃)₂CH-</text>

                        <text x="60" y="115" fill="#f59e0b" font-size="11" font-weight="bold">1.72 ppm (nonet,
                            1H):</text>
                        <text x="230" y="115" fill="#1e293b" font-size="10">1个CH，被8个H偶合(6+2) → 九重峰</text>

                        <text x="60" y="145" fill="#db2777" font-size="11" font-weight="bold">3.16 ppm (d, 2H):</text>
                        <text x="230" y="145" fill="#1e293b" font-size="10">1个CH₂，被1个H偶合，低场=连I</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('nmr4')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>工具2: 结构组装</h2>
            <div class="svg-container">
                <svg id="svg-str4" width="650" height="140" viewBox="0 0 650 140">
                    <g id="str4-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#16a34a" font-size="13"
                            font-weight="bold">结构推断</text>
                        <text x="325" y="85" text-anchor="middle" fill="#1e293b" font-size="13">(CH₃)₂CH-CH₂-I</text>
                        <text x="325" y="110" text-anchor="middle" fill="#db2777" font-size="12" font-weight="bold">异丁基碘
                            (Isobutyl iodide)</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('str4')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 最终答案</h2>
            <div class="answer-box">
                <p><strong>结构:</strong> (CH₃)₂CH-CH₂-I</p>
                <p><strong>名称:</strong> 1-碘-2-甲基丙烷 (异丁基碘)</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
