<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part1 I.5 - 有机合成填空</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 50%, #f0fdf4 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '🧪';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Part1 I.5 - 有机合成填空</h1>

        <div class="card">
            <h2>反应1: Diels-Alder反应</h2>
            <div class="explanation">
                <strong>反应物:</strong> 异戊二烯 (二烯) + 丙炔醛 (亲二烯体)
            </div>
            <div class="svg-container">
                <svg id="svg-da" width="650" height="130" viewBox="0 0 650 130">
                    <g id="da-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">[4+2]
                            环加成反应</text>
                        <text x="325" y="80" text-anchor="middle" fill="#1e293b" font-size="11">异戊二烯 + 丙炔醛 → 甲基取代的环己二烯醛
                            (加热Δ)</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('da')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>反应2: HCl加成</h2>
            <div class="explanation">
                <strong>反应:</strong> 异戊二烯 + 1 equiv HCl
            </div>
            <div class="svg-container">
                <svg id="svg-hcl" width="650" height="160" viewBox="0 0 650 160">
                    <g id="hcl-step1" opacity="0">
                        <rect x="30" y="20" width="590" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#16a34a" font-size="13"
                            font-weight="bold">1,2-加成 vs 1,4-加成</text>

                        <text x="60" y="85" fill="#db2777" font-size="11" font-weight="bold">1,2-加成产物:</text>
                        <text x="200" y="85" fill="#1e293b" font-size="10">动力学产物 (低温)</text>

                        <text x="60" y="115" fill="#2563eb" font-size="11" font-weight="bold">1,4-加成产物:</text>
                        <text x="200" y="115" fill="#1e293b" font-size="10">热力学产物 (高温，更稳定)</text>
                    </g>
                </svg>
                <div class="controls"><button class="btn" onclick="toggleAnim('hcl')">▶️ 显示</button></div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 答案总结</h2>
            <div class="answer-box">
                <p><strong>Diels-Alder:</strong> 形成甲基取代环己二烯醛</p>
                <p><strong>HCl加成:</strong> 产生1,2-和1,4-加成两种氯代烯烃</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
