<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part1 I.6 - 反应机理</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fce7f3 50%, #dbeafe 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '⚗️';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚗️ Part1 I.6 - 酸催化闭环机理</h1>

        <div class="card">
            <h2>反应概述</h2>
            <div class="explanation">
                <strong>底物:</strong> 含双键和羟基的分子<br>
                <strong>催化剂:</strong> H₂SO₄ (硫酸)<br>
                <strong>产物:</strong> 双环醚
            </div>
        </div>

        <div class="card">
            <h2>机理步骤</h2>
            <div class="svg-container">
                <svg id="svg-mech" width="650" height="280" viewBox="0 0 650 280">
                    <g id="mech-step1" opacity="0">
                        <rect x="30" y="20" width="280" height="80" rx="10" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="170" y="50" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">步骤1:
                            质子化双键</text>
                        <text x="170" y="75" text-anchor="middle" fill="#1e293b" font-size="10">H⁺加在末端碳，形成叔碳正离子</text>
                    </g>

                    <g id="mech-step2" opacity="0">
                        <rect x="340" y="20" width="280" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="480" y="50" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">步骤2:
                            亲核进攻</text>
                        <text x="480" y="75" text-anchor="middle" fill="#1e293b" font-size="10">OH的氧进攻C⁺，形成新环</text>
                    </g>

                    <g id="mech-step3" opacity="0">
                        <rect x="185" y="120" width="280" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="325" y="150" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">步骤3:
                            去质子化</text>
                        <text x="325" y="175" text-anchor="middle" fill="#1e293b" font-size="10">H₂O夺走O⁺上的H⁺ →
                            双环醚产物</text>
                    </g>

                    <g id="mech-step4" opacity="0">
                        <rect x="100" y="220" width="450" height="45" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="325" y="248" text-anchor="middle" fill="#2563eb" font-size="12"
                            font-weight="bold">H₃O⁺再生催化剂，循环继续</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('mech')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('mech')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-mech">步骤: 0/4</div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 机理总结</h2>
            <div class="answer-box">
                <p><strong>第一步:</strong> H⁺质子化双键 → 叔碳正离子</p>
                <p><strong>第二步:</strong> OH氧的孤对电子进攻C⁺ → 成环，O变O⁺</p>
                <p><strong>第三步:</strong> 失去H⁺ → 中性双环醚产物</p>
            </div>
        </div>
    </div>

    <script>
        const animationStates = {
            mech: { current: 0, max: 4, elements: ['mech-step1', 'mech-step2', 'mech-step3', 'mech-step4'] }
        };
        function nextStep(animId) {
            const state = animationStates[animId];
            if (state.current < state.max) {
                const el = document.getElementById(state.elements[state.current]);
                if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = '1'; }
                state.current++;
                document.getElementById(`step-${animId}`).textContent = `步骤: ${state.current}/${state.max}`;
            } else { resetAnimation(animId); }
        }
        function resetAnimation(animId) {
            const state = animationStates[animId];
            state.elements.forEach(id => { const el = document.getElementById(id); if (el) { el.style.opacity = '0'; } });
            state.current = 0;
            document.getElementById(`step-${animId}`).textContent = `步骤: 0/${state.max}`;
        }
    </script>
</body>

</html>
