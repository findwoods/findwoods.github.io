<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part2 II.2 - 热平衡优势方</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #fdf4ff 50%, #f0fdf4 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }

        .card h2::before {
            content: '⚖️';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.4);
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .highlight {
            color: var(--accent);
            font-weight: bold;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .answer-box h3 {
            color: #16a34a;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚖️ Part2 II.2 - 热平衡优势方</h1>

        <!-- 2.1 二烯稳定性 -->
        <div class="card">
            <h2>问题1: 共轭二烯 vs 隔离二烯</h2>
            <div class="svg-container">
                <svg id="svg-diene" width="700" height="280" viewBox="0 0 700 280">
                    <g id="diene-step1" opacity="0">
                        <text x="350" y="30" text-anchor="middle" fill="#1e293b" font-size="16"
                            font-weight="bold">哪种二烯更稳定？</text>

                        <!-- 左边: 共轭二烯 -->
                        <rect x="50" y="50" width="250" height="120" rx="15" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="3" />
                        <text x="175" y="80" text-anchor="middle" fill="#16a34a" font-size="14"
                            font-weight="bold">共轭二烯</text>
                        <text x="175" y="105" text-anchor="middle" fill="#1e293b" font-size="13">C=C-C=C</text>
                        <text x="175" y="130" text-anchor="middle" fill="#64748b" font-size="11">电子离域 → 更稳定</text>
                        <text x="175" y="155" text-anchor="middle" fill="#16a34a" font-size="18" font-weight="bold">✓
                            圈这边</text>

                        <!-- 右边: 隔离二烯 -->
                        <rect x="400" y="50" width="250" height="120" rx="15" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="525" y="80" text-anchor="middle" fill="#dc2626" font-size="14"
                            font-weight="bold">隔离二烯</text>
                        <text x="525" y="105" text-anchor="middle" fill="#1e293b" font-size="13">C=C-C-C=C</text>
                        <text x="525" y="130" text-anchor="middle" fill="#64748b" font-size="11">电子分离 → 无额外稳定</text>
                        <text x="525" y="155" text-anchor="middle" fill="#dc2626" font-size="14">✗</text>
                    </g>

                    <g id="diene-step2" opacity="0">
                        <rect x="100" y="190" width="500" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" />
                        <text x="350" y="220" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">💡
                            共轭体系的p轨道重叠，电子可以"跑来跑去"</text>
                        <text x="350" y="245" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">答案:
                            圈左边 (共轭二烯)</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('diene')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('diene')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-diene">步骤: 0/2</div>
            </div>
        </div>

        <!-- 2.2 炔烃酸碱 -->
        <div class="card">
            <h2>问题2: 炔钠与水的平衡</h2>
            <div class="explanation">
                CH₃C≡C⁻Na⁺ + H₂O ⇌ CH₃C≡CH + NaOH
            </div>
            <div class="svg-container">
                <svg id="svg-alkyne" width="700" height="250" viewBox="0 0 700 250">
                    <g id="alkyne-step1" opacity="0">
                        <rect x="50" y="30" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="150" y="60" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">左边的酸:
                            H₂O</text>
                        <text x="150" y="85" text-anchor="middle" fill="#2563eb" font-size="12">pKa ≈ 15.7</text>

                        <rect x="450" y="30" width="200" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="550" y="60" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="bold">右边的酸:
                            RC≡CH</text>
                        <text x="550" y="85" text-anchor="middle" fill="#16a34a" font-size="12">pKa ≈ 25</text>
                    </g>

                    <g id="alkyne-step2" opacity="0">
                        <rect x="150" y="130" width="400" height="100" rx="15" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="3" />
                        <text x="350" y="160" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">💡
                            强酸制弱酸：pKa大的更稳定</text>
                        <text x="350" y="185" text-anchor="middle" fill="#1e293b" font-size="13">25 > 15.7 →
                            炔烃是弱酸</text>
                        <text x="350" y="215" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="bold">答案:
                            圈右边 ✓</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('alkyne')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('alkyne')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-alkyne">步骤: 0/2</div>
            </div>
        </div>

        <!-- 2.3 环己烷构象 -->
        <div class="card">
            <h2>问题3: 环己烷椅式构象</h2>
            <div class="svg-container">
                <svg id="svg-chair" width="700" height="280" viewBox="0 0 700 280">
                    <g id="chair-step1" opacity="0">
                        <text x="350" y="30" text-anchor="middle" fill="#1e293b" font-size="16"
                            font-weight="bold">二氯环己烷: e键 vs a键</text>

                        <!-- 左: 双e键 -->
                        <rect x="50" y="50" width="250" height="130" rx="15" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="3" />
                        <text x="175" y="80" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">双平伏键
                            (e,e)</text>
                        <text x="175" y="110" text-anchor="middle" fill="#1e293b" font-size="12">Cl在赤道位置</text>
                        <text x="175" y="135" text-anchor="middle" fill="#64748b" font-size="11">空间开阔，无位阻</text>
                        <text x="175" y="165" text-anchor="middle" fill="#16a34a" font-size="18" font-weight="bold">✓
                            更稳定</text>

                        <!-- 右: 双a键 -->
                        <rect x="400" y="50" width="250" height="130" rx="15" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="525" y="80" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">双直立键
                            (a,a)</text>
                        <text x="525" y="110" text-anchor="middle" fill="#1e293b" font-size="12">Cl在旗杆位置</text>
                        <text x="525" y="135" text-anchor="middle" fill="#64748b" font-size="11">1,3-二轴向位阻</text>
                        <text x="525" y="165" text-anchor="middle" fill="#dc2626" font-size="14">✗ 不稳定</text>
                    </g>

                    <g id="chair-step2" opacity="0">
                        <rect x="150" y="200" width="400" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" />
                        <text x="350" y="225" text-anchor="middle" fill="#1e293b" font-size="13"
                            font-weight="bold">大基团在e键最稳定</text>
                        <text x="350" y="248" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">答案:
                            圈左边 (双e键) ✓</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('chair')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('chair')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-chair">步骤: 0/2</div>
            </div>
        </div>

        <!-- 2.4 甲基锂与氨 -->
        <div class="card">
            <h2>问题4: 甲基锂与氨的平衡</h2>
            <div class="explanation">
                CH₃Li + NH₃ ⇌ LiNH₂ + CH₄
            </div>
            <div class="svg-container">
                <svg id="svg-methane" width="700" height="250" viewBox="0 0 700 250">
                    <g id="methane-step1" opacity="0">
                        <rect x="50" y="30" width="200" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="150" y="60" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">左边的酸:
                            NH₃</text>
                        <text x="150" y="85" text-anchor="middle" fill="#f59e0b" font-size="12">pKa ≈ 38</text>

                        <rect x="450" y="30" width="200" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="550" y="60" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="bold">右边的酸:
                            CH₄</text>
                        <text x="550" y="85" text-anchor="middle" fill="#16a34a" font-size="12">pKa ≈ 50</text>
                    </g>

                    <g id="methane-step2" opacity="0">
                        <rect x="150" y="130" width="400" height="100" rx="15" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="3" />
                        <text x="350" y="160" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">💡
                            50 >> 38，甲烷是极弱酸</text>
                        <text x="350" y="185" text-anchor="middle" fill="#1e293b" font-size="13">平衡彻底偏向生成弱酸CH₄</text>
                        <text x="350" y="215" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="bold">答案:
                            圈右边 ✓</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('methane')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('methane')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-methane">步骤: 0/2</div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 答案总结</h2>
            <div class="answer-box">
                <p><strong>2.1 二烯:</strong> 圈左边 (共轭二烯更稳定)</p>
                <p><strong>2.2 炔烃:</strong> 圈右边 (pKa 25 > 15.7)</p>
                <p><strong>2.3 环己烷:</strong> 圈左边 (双e键更稳定)</p>
                <p><strong>2.4 甲基锂:</strong> 圈右边 (pKa 50 >> 38)</p>
            </div>
        </div>
    </div>

    <script>
        const animationStates = {
            diene: { current: 0, max: 2, elements: ['diene-step1', 'diene-step2'] },
            alkyne: { current: 0, max: 2, elements: ['alkyne-step1', 'alkyne-step2'] },
            chair: { current: 0, max: 2, elements: ['chair-step1', 'chair-step2'] },
            methane: { current: 0, max: 2, elements: ['methane-step1', 'methane-step2'] }
        };
        function nextStep(animId) {
            const state = animationStates[animId];
            if (state.current < state.max) {
                const el = document.getElementById(state.elements[state.current]);
                if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = '1'; }
                state.current++;
                document.getElementById(`step-${animId}`).textContent = `步骤: ${state.current}/${state.max}`;
            } else { resetAnimation(animId); }
        }
        function resetAnimation(animId) {
            const state = animationStates[animId];
            state.elements.forEach(id => { const el = document.getElementById(id); if (el) { el.style.opacity = '0'; } });
            state.current = 0;
            document.getElementById(`step-${animId}`).textContent = `步骤: 0/${state.max}`;
        }
    </script>
</body>

</html>
