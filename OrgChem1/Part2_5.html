<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part2 II.5 - 填空补全</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #eff6ff 50%, #ecfeff 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📝 Part2 II.5 - 填空补全</h1>

        <!-- 反应A -->
        <div class="card">
            <h2>反应A: 烯烃硼氢化-氧化</h2>
            <div class="svg-container">
                <svg id="svg-a" width="650" height="140" viewBox="0 0 650 140">
                    <g id="a-step1" opacity="0">
                        <rect x="20" y="20" width="610" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#16a34a" font-size="13"
                            font-weight="bold">2-乙基-1-丁烯 → 一级醇</text>
                        <text x="50" y="80" fill="#1e293b" font-size="12">
                            <tspan font-weight="bold">试剂:</tspan> 1. BH₃/THF 2. H₂O₂/NaOH
                        </text>
                        <text x="50" y="105" fill="#64748b" font-size="11">反马氏加成: OH加在少取代碳上 → 一级醇</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('a')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 反应B -->
        <div class="card">
            <h2>反应B: 卤代醇化</h2>
            <div class="svg-container">
                <svg id="svg-b" width="650" height="140" viewBox="0 0 650 140">
                    <g id="b-step1" opacity="0">
                        <rect x="20" y="20" width="610" height="100" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#2563eb" font-size="13"
                            font-weight="bold">1-甲基环戊烯 → 氯代醇</text>
                        <text x="50" y="80" fill="#1e293b" font-size="12">
                            <tspan font-weight="bold">试剂:</tspan> Cl₂/H₂O
                        </text>
                        <text x="50" y="105" fill="#64748b" font-size="11">OH加在多取代碳上(马氏)，Cl在邻碳，反式加成</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('b')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 反应C -->
        <div class="card">
            <h2>反应C: 格氏试剂氘代</h2>
            <div class="svg-container">
                <svg id="svg-c" width="650" height="140" viewBox="0 0 650 140">
                    <g id="c-step1" opacity="0">
                        <rect x="20" y="20" width="610" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">溴代烷 →
                            氘代烷</text>
                        <text x="50" y="80" fill="#1e293b" font-size="12">
                            <tspan font-weight="bold">试剂:</tspan> 1. Mg/ether (形成格氏试剂) 2. D₂O
                        </text>
                        <text x="50" y="105" fill="#64748b" font-size="11">R-Br → R-MgBr → R-D</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('c')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 反应D -->
        <div class="card">
            <h2>反应D: 炔还原为反式烯</h2>
            <div class="svg-container">
                <svg id="svg-d" width="650" height="140" viewBox="0 0 650 140">
                    <g id="d-step1" opacity="0">
                        <rect x="20" y="20" width="610" height="100" rx="10" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#db2777" font-size="13" font-weight="bold">烯-炔 →
                            共轭二烯</text>
                        <text x="50" y="80" fill="#1e293b" font-size="12">
                            <tspan font-weight="bold">试剂:</tspan> Li/NH₃ (金属还原)
                        </text>
                        <text x="50" y="105" fill="#64748b" font-size="11">三键→反式双键，原双键保留</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('d')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 反应E -->
        <div class="card">
            <h2>反应E: Gilman偶联</h2>
            <div class="svg-container">
                <svg id="svg-e" width="650" height="140" viewBox="0 0 650 140">
                    <g id="e-step1" opacity="0">
                        <rect x="20" y="20" width="610" height="100" rx="10" fill="#ecfeff" stroke="#0891b2"
                            stroke-width="2" />
                        <text x="325" y="50" text-anchor="middle" fill="#0891b2" font-size="13" font-weight="bold">碘苯 →
                            丙苯</text>
                        <text x="50" y="80" fill="#1e293b" font-size="12">
                            <tspan font-weight="bold">试剂:</tspan> 1. Li 2. CuI 3. CH₃CH₂CH₂I
                        </text>
                        <text x="50" y="105" fill="#64748b" font-size="11">Ph-I → Ph-Li → Ph₂CuLi → Ph-Pr</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('e')">▶️ 显示</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) {
                el.style.transition = 'opacity 0.5s';
                el.style.opacity = el.style.opacity === '1' ? '0' : '1';
            }
        }
    </script>
</body>

</html>
