<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part2 II.6 - 反应机理</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fce7f3 50%, #dbeafe 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .card h2::before {
            content: '⚗️';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #eff6ff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚗️ Part2 II.6 - 酸催化多环化机理</h1>

        <div class="card">
            <h2>反应概述</h2>
            <div class="explanation">
                <strong>底物:</strong> 双环分子，含双键、羟基和酮<br>
                <strong>条件:</strong> H₂SO₄ (酸催化)<br>
                <strong>产物:</strong> 笼状多醚结构
            </div>
        </div>

        <div class="card">
            <h2>机理步骤1-2: 质子化与半缩酮形成</h2>
            <div class="svg-container">
                <svg id="svg-m1" width="700" height="200" viewBox="0 0 700 200">
                    <g id="m1-step1" opacity="0">
                        <rect x="30" y="20" width="300" height="160" rx="10" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="180" y="50" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="bold">步骤1:
                            质子化</text>
                        <text x="50" y="80" fill="#1e293b" font-size="11">H⁺进攻酮基氧</text>
                        <text x="50" y="105" fill="#1e293b" font-size="11">C=O → C=O⁺-H</text>
                        <text x="50" y="135" fill="#64748b" font-size="10">碳变得极度亲电</text>
                        <text x="50" y="160" fill="#64748b" font-size="10">"饥渴"地需要电子</text>
                    </g>

                    <g id="m1-step2" opacity="0">
                        <rect x="370" y="20" width="300" height="160" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="520" y="50" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">步骤2:
                            半缩酮形成</text>
                        <text x="390" y="80" fill="#1e293b" font-size="11">分子内OH进攻酮碳</text>
                        <text x="390" y="105" fill="#1e293b" font-size="11">O的孤对电子攻击C⁺</text>
                        <text x="390" y="135" fill="#64748b" font-size="10">形成五元氧杂环</text>
                        <text x="390" y="160" fill="#64748b" font-size="10">这叫"半缩酮"</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('m1')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('m1')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-m1">步骤: 0/2</div>
            </div>
        </div>

        <div class="card">
            <h2>机理步骤3-4: 制造离去基与氧鎓离子</h2>
            <div class="svg-container">
                <svg id="svg-m2" width="700" height="200" viewBox="0 0 700 200">
                    <g id="m2-step1" opacity="0">
                        <rect x="30" y="20" width="300" height="160" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="180" y="50" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">步骤3:
                            制造离去基团</text>
                        <text x="50" y="80" fill="#1e293b" font-size="11">原酮氧变成的OH</text>
                        <text x="50" y="105" fill="#1e293b" font-size="11">再抓一个H⁺</text>
                        <text x="50" y="135" fill="#1e293b" font-size="11">-OH + H⁺ → -OH₂⁺</text>
                        <text x="50" y="160" fill="#64748b" font-size="10">水是很好的离去基团</text>
                    </g>

                    <g id="m2-step2" opacity="0">
                        <rect x="370" y="20" width="300" height="160" rx="10" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="520" y="50" text-anchor="middle" fill="#db2777" font-size="13" font-weight="bold">步骤4:
                            氧鎓离子形成</text>
                        <text x="390" y="80" fill="#1e293b" font-size="11">羟基的氧推电子</text>
                        <text x="390" y="105" fill="#1e293b" font-size="11">帮助踢走H₂O</text>
                        <text x="390" y="135" fill="#1e293b" font-size="11">形成C=O⁺ (氧鎓离子)</text>
                        <text x="390" y="160" fill="#64748b" font-size="10">极强亲电体!</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('m2')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('m2')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-m2">步骤: 0/2</div>
            </div>
        </div>

        <div class="card">
            <h2>机理步骤5-6: 双键进攻与成环</h2>
            <div class="svg-container">
                <svg id="svg-m3" width="700" height="200" viewBox="0 0 700 200">
                    <g id="m3-step1" opacity="0">
                        <rect x="30" y="20" width="300" height="160" rx="10" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="180" y="50" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="bold">步骤5:
                            双键进攻</text>
                        <text x="50" y="80" fill="#1e293b" font-size="11">分子另一端的双键</text>
                        <text x="50" y="105" fill="#1e293b" font-size="11">π电子攻击氧鎓碳</text>
                        <text x="50" y="135" fill="#1e293b" font-size="11">形成新C-C键</text>
                        <text x="50" y="160" fill="#64748b" font-size="10">双键另一碳变C⁺</text>
                    </g>

                    <g id="m3-step2" opacity="0">
                        <rect x="370" y="20" width="300" height="160" rx="10" fill="#ecfeff" stroke="#0891b2"
                            stroke-width="2" />
                        <text x="520" y="50" text-anchor="middle" fill="#0891b2" font-size="13" font-weight="bold">步骤6:
                            最终成环</text>
                        <text x="390" y="80" fill="#1e293b" font-size="11">附近的氧孤对电子</text>
                        <text x="390" y="105" fill="#1e293b" font-size="11">攻击新的碳正离子</text>
                        <text x="390" y="135" fill="#1e293b" font-size="11">失去H⁺，形成醚键</text>
                        <text x="390" y="160" fill="#16a34a" font-size="11" font-weight="bold">✓ 笼状多醚完成</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('m3')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('m3')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-m3">步骤: 0/2</div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 机理总结</h2>
            <div class="answer-box">
                <p><strong>口诀:</strong> "酸让酮变身，羟基咬一口，脱水变怪兽，双键来救援，最后团成球"</p>
                <p style="margin-top:0.5rem;"><strong>六步:</strong></p>
                <p>1. 质子化酮 → 2. 半缩酮 → 3. 质子化OH</p>
                <p>4. 脱水成氧鎓 → 5. 双键进攻 → 6. 成环去H⁺</p>
            </div>
        </div>
    </div>

    <script>
        const animationStates = {
            m1: { current: 0, max: 2, elements: ['m1-step1', 'm1-step2'] },
            m2: { current: 0, max: 2, elements: ['m2-step1', 'm2-step2'] },
            m3: { current: 0, max: 2, elements: ['m3-step1', 'm3-step2'] }
        };
        function nextStep(animId) {
            const state = animationStates[animId];
            if (state.current < state.max) {
                const el = document.getElementById(state.elements[state.current]);
                if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = '1'; }
                state.current++;
                document.getElementById(`step-${animId}`).textContent = `步骤: ${state.current}/${state.max}`;
            } else { resetAnimation(animId); }
        }
        function resetAnimation(animId) {
            const state = animationStates[animId];
            state.elements.forEach(id => { const el = document.getElementById(id); if (el) { el.style.opacity = '0'; } });
            state.current = 0;
            document.getElementById(`step-${animId}`).textContent = `步骤: 0/${state.max}`;
        }
    </script>
</body>

</html>
