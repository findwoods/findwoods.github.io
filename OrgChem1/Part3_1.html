<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part3 III.1 - 手性中心R/S标记</title>
    <style>
        :root {
            --primary: #0891b2;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #ecfeff 0%, #f0fdf4 50%, #fdf4ff 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .card h2::before {
            content: '🔷';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #ecfeff, #f0fdf4);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔷 Part3 III.1 - 手性中心R/S标记</h1>

        <div class="card">
            <h2>R/S判断规则</h2>
            <div class="explanation">
                <strong>步骤：</strong><br>
                1. 找出连着4个不同基团的碳（手性中心）<br>
                2. 按原子序数排优先级：O > N > C > H<br>
                3. 把最低优先级（通常是H）放到后面<br>
                4. 看1→2→3的旋转方向：顺时针=R，逆时针=S
            </div>
        </div>

        <div class="card">
            <h2>工具1: 优先级排序规则</h2>
            <div class="svg-container">
                <svg id="svg-rule" width="700" height="200" viewBox="0 0 700 200">
                    <g id="rule-step1" opacity="0">
                        <text x="350" y="35" text-anchor="middle" fill="#1e293b" font-size="16"
                            font-weight="bold">原子优先级排序 (CIP规则)</text>

                        <rect x="80" y="60" width="100" height="60" rx="10" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="130" y="95" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">O
                            (8)</text>
                        <text x="130" y="115" text-anchor="middle" fill="#64748b" font-size="10">第1优先</text>

                        <rect x="200" y="60" width="100" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="250" y="95" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">N
                            (7)</text>
                        <text x="250" y="115" text-anchor="middle" fill="#64748b" font-size="10">第2优先</text>

                        <rect x="320" y="60" width="100" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="370" y="95" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="bold">C
                            (6)</text>
                        <text x="370" y="115" text-anchor="middle" fill="#64748b" font-size="10">第3优先</text>

                        <rect x="440" y="60" width="100" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"
                            stroke-width="2" />
                        <text x="490" y="95" text-anchor="middle" fill="#64748b" font-size="14" font-weight="bold">H
                            (1)</text>
                        <text x="490" y="115" text-anchor="middle" fill="#64748b" font-size="10">第4优先</text>

                        <text x="350" y="160" fill="#64748b" font-size="12" text-anchor="middle">原子序数越大，优先级越高</text>
                        <text x="350" y="180" fill="#0891b2" font-size="12" text-anchor="middle"
                            font-weight="bold">如果第一层相同，则比较下一层连接的原子</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('rule')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>工具2: R/S旋转判断</h2>
            <div class="svg-container">
                <svg id="svg-rs" width="700" height="280" viewBox="0 0 700 280">
                    <g id="rs-step1" opacity="0">
                        <!-- R型 -->
                        <rect x="50" y="30" width="280" height="220" rx="15" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="190" y="60" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="bold">R
                            (顺时针)</text>

                        <circle cx="190" cy="140" r="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" />
                        <text x="190" y="100" text-anchor="middle" fill="#dc2626" font-size="14"
                            font-weight="bold">1</text>
                        <text x="230" y="165" text-anchor="middle" fill="#f59e0b" font-size="14"
                            font-weight="bold">2</text>
                        <text x="150" y="165" text-anchor="middle" fill="#2563eb" font-size="14"
                            font-weight="bold">3</text>

                        <path d="M170 100 A30 30 0 0 1 220 140" stroke="#16a34a" stroke-width="3" fill="none"
                            marker-end="url(#arrowR)" />
                        <text x="190" y="220" text-anchor="middle" fill="#16a34a" font-size="12">1→2→3 顺时针 ➡️</text>

                        <!-- S型 -->
                        <rect x="370" y="30" width="280" height="220" rx="15" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="510" y="60" text-anchor="middle" fill="#db2777" font-size="16" font-weight="bold">S
                            (逆时针)</text>

                        <circle cx="510" cy="140" r="50" fill="#fdf2f8" stroke="#db2777" stroke-width="3" />
                        <text x="510" y="100" text-anchor="middle" fill="#dc2626" font-size="14"
                            font-weight="bold">1</text>
                        <text x="470" y="165" text-anchor="middle" fill="#f59e0b" font-size="14"
                            font-weight="bold">2</text>
                        <text x="550" y="165" text-anchor="middle" fill="#2563eb" font-size="14"
                            font-weight="bold">3</text>

                        <path d="M530 100 A30 30 0 0 0 480 140" stroke="#db2777" stroke-width="3" fill="none"
                            marker-end="url(#arrowS)" />
                        <text x="510" y="220" text-anchor="middle" fill="#db2777" font-size="12">1→2→3 逆时针 ⬅️</text>
                    </g>

                    <defs>
                        <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
                        </marker>
                        <marker id="arrowS" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#db2777" />
                        </marker>
                    </defs>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('rs')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 本题答案</h2>
            <div class="answer-box">
                <p><strong>三个手性中心的标记：</strong></p>
                <p>• 顶部碳 (连Me): <strong style="color:#db2777">S</strong></p>
                <p>• 左侧碳 (连OH): <strong style="color:#db2777">S</strong></p>
                <p>• 中间桥头碳: <strong style="color:#db2777">S</strong></p>
                <p style="margin-top:0.5rem;color:#64748b;font-size:0.9rem;">判断时注意：O > N > C > H，相同时比较下一层</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) {
                el.style.transition = 'opacity 0.5s';
                el.style.opacity = el.style.opacity === '1' ? '0' : '1';
            }
        }
    </script>
</body>

</html>
