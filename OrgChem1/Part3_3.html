<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part3 III.3 - 共轭二烯反应机理</title>
    <style>
        :root {
            --primary: #0891b2;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fce7f3 50%, #ecfeff 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '⚗️';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #ecfeff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚗️ Part3 III.3 - 共轭二烯反应机理</h1>

        <div class="card">
            <h2>反应概述</h2>
            <div class="explanation">
                <strong>原料:</strong> 6C环 + OH + 双键尾巴<br>
                <strong>条件:</strong> H₂SO₄, THF, 339K<br>
                <strong>产物:</strong> A (15%) 和 B (30%)
            </div>
        </div>

        <!-- 机理第一阶段 -->
        <div class="card">
            <h2>阶段1-2: 质子化与离去</h2>
            <div class="svg-container">
                <svg id="svg-m1" width="680" height="160" viewBox="0 0 680 160">
                    <g id="m1-step1" opacity="0">
                        <rect x="20" y="20" width="300" height="120" rx="10" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="170" y="50" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">阶段1:
                            质子化</text>
                        <text x="40" y="80" fill="#1e293b" font-size="11">-OH + H⁺ → -OH₂⁺</text>
                        <text x="40" y="105" fill="#64748b" font-size="10">水变成好离去基团</text>

                        <rect x="360" y="20" width="300" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="510" y="50" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">阶段2:
                            离去</text>
                        <text x="380" y="80" fill="#1e293b" font-size="11">C-OH₂⁺ → C⁺ + H₂O</text>
                        <text x="380" y="105" fill="#64748b" font-size="10">形成碳正离子（不稳定）</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('m1')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 机理第二阶段 -->
        <div class="card">
            <h2>阶段3: 共振稳定</h2>
            <div class="svg-container">
                <svg id="svg-m2" width="680" height="130" viewBox="0 0 680 130">
                    <g id="m2-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#2563eb" font-size="12"
                            font-weight="bold">双键电子流动帮助稳定正电荷</text>
                        <text x="40" y="80" fill="#1e293b" font-size="11">C⁺ 旁边的双键 → 电子流向C⁺ → 正电荷可以在两个位置跳动</text>
                        <text x="340" y="100" text-anchor="middle" fill="#64748b" font-size="10">这叫"共振稳定"的烯丙基碳正离子</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('m2')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 产物形成 -->
        <div class="card">
            <h2>阶段4: 两条路径 → A和B</h2>
            <div class="svg-container">
                <svg id="svg-m3" width="680" height="200" viewBox="0 0 680 200">
                    <g id="m3-step1" opacity="0">
                        <rect x="20" y="20" width="300" height="160" rx="10" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="170" y="50" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">路径A
                            (15%)</text>
                        <text x="40" y="80" fill="#1e293b" font-size="11">拿走尾端H</text>
                        <text x="40" y="105" fill="#1e293b" font-size="11">形成隔离双键</text>
                        <text x="40" y="130" fill="#64748b" font-size="10">C=C...C=C (中间隔开)</text>
                        <text x="40" y="155" fill="#dc2626" font-size="10">较不稳定 → 产量少</text>

                        <rect x="360" y="20" width="300" height="160" rx="10" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="510" y="50" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">路径B
                            (30%)</text>
                        <text x="380" y="80" fill="#1e293b" font-size="11">拿走环上H</text>
                        <text x="380" y="105" fill="#1e293b" font-size="11">形成共轭双键</text>
                        <text x="380" y="130" fill="#64748b" font-size="10">C=C-C=C (双-单-双)</text>
                        <text x="380" y="155" fill="#16a34a" font-size="10">更稳定 → 产量多 ✓</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('m3')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>计算 [A]/[B]</h2>
            <div class="svg-container">
                <svg id="svg-calc" width="680" height="120" viewBox="0 0 680 120">
                    <g id="calc-step1" opacity="0">
                        <rect x="100" y="20" width="480" height="80" rx="15" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="340" y="55" text-anchor="middle" fill="#1e293b" font-size="14">[A]/[B] = 15%/30% =
                            <tspan font-weight="bold" fill="#16a34a">0.5</tspan></text>
                        <text x="340" y="85" text-anchor="middle" fill="#16a34a" font-size="13"
                            font-weight="bold">B的自由能更低 (更稳定，产量更多)</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('calc')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 关键结论</h2>
            <div class="answer-box">
                <p><strong>为什么B更多？</strong></p>
                <p>B是<span style="color:#16a34a;font-weight:bold">共轭二烯</span>（C=C-C=C），电子可以在四个碳之间离域流动</p>
                <p>共轭使能量降低，分子更稳定，所以B产量更高</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
