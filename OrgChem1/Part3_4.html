<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part3 III.4 - 复杂变形机理</title>
    <style>
        :root {
            --primary: #0891b2;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #ecfeff 0%, #fdf4ff 50%, #f0fdf4 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '🔄';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #ecfeff, #fdf4ff);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-size: 0.95rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔄 Part3 III.4 - 复杂变形机理</h1>

        <!-- 反应1: SOCl2脱水 -->
        <div class="card">
            <h2>反应1: SOCl₂脱水消除</h2>
            <div class="explanation">
                <strong>试剂:</strong> SOCl₂ (氯化亚砜) + 吡啶<br>
                <strong>效果:</strong> OH变成双键
            </div>
            <div class="svg-container">
                <svg id="svg-r1" width="680" height="180" viewBox="0 0 680 180">
                    <g id="r1-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="140" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#2563eb" font-size="13"
                            font-weight="bold">SOCl₂消除机理</text>

                        <text x="40" y="85" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">1. 装弹头:</tspan> -OH + SOCl₂ → -O-SO-Cl (好离去基)
                        </text>
                        <text x="40" y="115" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">2. 消除:</tspan> 吡啶拿走邻碳H，电子倒向形成双键
                        </text>
                        <text x="40" y="145" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">3. 产物:</tspan> 烯烃 + SO₂↑ + HCl
                        </text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('r1')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 反应2: Wagner-Meerwein重排 -->
        <div class="card">
            <h2>反应2: Wagner-Meerwein重排</h2>
            <div class="explanation">
                <strong>特点:</strong> 五元环变六元环 + Br变酮
            </div>
            <div class="svg-container">
                <svg id="svg-r2" width="680" height="200" viewBox="0 0 680 200">
                    <g id="r2-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="160" rx="10" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#db2777" font-size="13" font-weight="bold">重排机理
                            (扩环)</text>

                        <text x="40" y="85" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">1. Br离去:</tspan> 形成五元环碳正离子 (张力大，不稳定)
                        </text>
                        <text x="40" y="115" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">2. 重排:</tspan> 邻碳的键"搬家"到正电荷位置 → 五变六
                        </text>
                        <text x="40" y="145" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">3. 捕获:</tspan> 甲酸中的O攻击新C⁺ → 最终变成酮
                        </text>
                        <text x="40" y="170" fill="#16a34a" font-size="11" font-weight="bold">结果: 六元环酮 (更稳定)</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('r2')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 反应3: 环醚形成 -->
        <div class="card">
            <h2>反应3: 分子内环化成环醚</h2>
            <div class="explanation">
                <strong>原料:</strong> 一头OH，一头双键<br>
                <strong>条件:</strong> H⁺酸催化
            </div>
            <div class="svg-container">
                <svg id="svg-r3" width="680" height="180" viewBox="0 0 680 180">
                    <g id="r3-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#16a34a" font-size="13"
                            font-weight="bold">分子内亲核环化</text>

                        <text x="40" y="85" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">1. 激活双键:</tspan> H⁺加到双键末端 → 内碳变C⁺
                        </text>
                        <text x="40" y="115" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">2. 关门:</tspan> 分子另一头的OH弯腰撞向C⁺ → 成环
                        </text>
                        <text x="40" y="145" fill="#1e293b" font-size="11">
                            <tspan font-weight="bold">3. 去质子:</tspan> 水分子拿走O上的H → 稳定环醚
                        </text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('r3')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 机理要点</h2>
            <div class="answer-box">
                <p><strong>SOCl₂:</strong> 把差离去基(-OH)变成好离去基(-OSOCl)</p>
                <p><strong>重排:</strong> 碳正离子不稳定时，邻碳的键会"搬家"来稳定</p>
                <p><strong>环化:</strong> 分子内亲核进攻，形成环状产物</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
