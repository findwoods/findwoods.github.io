<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part3 III.5 - 非经典碳正离子</title>
    <style>
        :root {
            --primary: #0891b2;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fdf4ff 0%, #ecfeff 50%, #fef3c7 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .card h2::before {
            content: '🔺';
            margin-right: 0.5rem;
        }

        .explanation {
            background: linear-gradient(135deg, #fdf4ff, #ecfeff);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 1rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .step-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #fce7f3);
            border: 2px solid #db2777;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔺 Part3 III.5 - 非经典碳正离子</h1>

        <div class="card">
            <h2>降冰片烷结构</h2>
            <div class="explanation">
                <strong>底物:</strong> Bicyclo[2.2.1]heptane (像帐篷/半开的书)<br>
                <strong>反应:</strong> Cl被OH取代 (溶剂解)
            </div>
        </div>

        <div class="card">
            <h2>工具: 非经典碳正离子机理</h2>
            <div class="svg-container">
                <svg id="svg-nonc" width="700" height="350" viewBox="0 0 700 350">
                    <!-- 步骤1: 离解 -->
                    <g id="nonc-step1" opacity="0">
                        <rect x="30" y="20" width="300" height="100" rx="10" fill="#fee2e2" stroke="#dc2626"
                            stroke-width="2" />
                        <text x="180" y="50" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="bold">步骤1:
                            Cl离去</text>
                        <text x="50" y="80" fill="#1e293b" font-size="11">Cl⁻离开，留下C⁺</text>
                        <text x="50" y="100" fill="#64748b" font-size="10">但是...背面的C-C键会来帮忙</text>
                    </g>

                    <!-- 步骤2: 非经典稳定 -->
                    <g id="nonc-step2" opacity="0">
                        <rect x="370" y="20" width="300" height="100" rx="10" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="520" y="50" text-anchor="middle" fill="#db2777" font-size="13" font-weight="bold">步骤2:
                            非经典稳定</text>
                        <text x="390" y="80" fill="#1e293b" font-size="11">"书脊"上的键摆过来</text>
                        <text x="390" y="100" fill="#db2777" font-size="10" font-weight="bold">正电荷被3个C共同分担 (三角形)</text>
                    </g>

                    <!-- 三角形示意 -->
                    <g id="nonc-step3" opacity="0">
                        <rect x="150" y="140" width="400" height="100" rx="15" fill="#eff6ff" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="350" y="170" text-anchor="middle" fill="#2563eb" font-size="14"
                            font-weight="bold">非经典碳正离子结构</text>

                        <!-- 三角形 -->
                        <polygon points="350,190 310,230 390,230" fill="none" stroke="#db2777" stroke-width="3"
                            stroke-dasharray="5,3" />
                        <circle cx="350" cy="190" r="8" fill="#dc2626" />
                        <circle cx="310" cy="230" r="8" fill="#2563eb" />
                        <circle cx="390" cy="230" r="8" fill="#2563eb" />
                        <text x="350" y="180" text-anchor="middle" fill="#dc2626" font-size="10">C⁺</text>
                        <text x="295" y="228" text-anchor="middle" fill="#2563eb" font-size="10">C</text>
                        <text x="405" y="228" text-anchor="middle" fill="#2563eb" font-size="10">C</text>

                        <text x="450" y="210" fill="#64748b" font-size="10">虚线=电子共享</text>
                        <text x="450" y="225" fill="#64748b" font-size="10">(像三脚架)</text>
                    </g>

                    <!-- 步骤3: 攻击方向 -->
                    <g id="nonc-step4" opacity="0">
                        <rect x="30" y="260" width="640" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="350" y="290" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="bold">步骤3:
                            水从外侧(Exo)进攻</text>
                        <text x="350" y="315" text-anchor="middle" fill="#1e293b" font-size="11">内侧被"摆过来的键"挡住 → 水只能从外侧攻击
                            → OH在Exo位置</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="resetAnimation('nonc')">🔄 重置</button>
                    <button class="btn" onclick="nextStep('nonc')">▶️ 下一步</button>
                </div>
                <div class="step-indicator" id="step-nonc">步骤: 0/4</div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 关键概念</h2>
            <div class="answer-box">
                <p><strong>非经典碳正离子:</strong> 正电荷不在一个碳上，而是被多个碳共同分担</p>
                <p><strong>立体化学后果:</strong> 进攻只能从未被阻挡的一面进行 (Exo)</p>
                <p><strong>产物特征:</strong> OH在外侧(Exo)位置，可能伴随骨架重排</p>
            </div>
        </div>
    </div>

    <script>
        const animationStates = {
            nonc: { current: 0, max: 4, elements: ['nonc-step1', 'nonc-step2', 'nonc-step3', 'nonc-step4'] }
        };
        function nextStep(animId) {
            const state = animationStates[animId];
            if (state.current < state.max) {
                const el = document.getElementById(state.elements[state.current]);
                if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = '1'; }
                state.current++;
                document.getElementById(`step-${animId}`).textContent = `步骤: ${state.current}/${state.max}`;
            } else { resetAnimation(animId); }
        }
        function resetAnimation(animId) {
            const state = animationStates[animId];
            state.elements.forEach(id => { const el = document.getElementById(id); if (el) { el.style.opacity = '0'; } });
            state.current = 0;
            document.getElementById(`step-${animId}`).textContent = `步骤: 0/${state.max}`;
        }
    </script>
</body>

</html>
