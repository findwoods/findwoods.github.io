<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part3 III.6 - 合成设计</title>
    <style>
        :root {
            --primary: #0891b2;
            --secondary: #7c3aed;
            --accent: #db2777;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #fef3c7 50%, #fce7f3 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card h2::before {
            content: '🧪';
            margin-right: 0.5rem;
        }

        .svg-container {
            background: #fefefe;
            border-radius: 0.8rem;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .answer-box {
            background: linear-gradient(135deg, #dcfce7, #dbeafe);
            border: 2px solid #16a34a;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Part3 III.6 - 合成设计</h1>

        <!-- 任务1: 臭氧分解 -->
        <div class="card">
            <h2>任务1: 双键变酮 (臭氧分解)</h2>
            <div class="svg-container">
                <svg id="svg-s1" width="680" height="120" viewBox="0 0 680 120">
                    <g id="s1-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">C=C →
                            C=O (酮)</text>
                        <text x="340" y="80" text-anchor="middle" fill="#1e293b" font-size="12">试剂: <tspan
                                font-weight="bold">1) O₃</tspan> (臭氧分解) <tspan font-weight="bold">2) Zn/H₃O⁺</tspan>
                            (还原)</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('s1')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 任务2: 增碳+加羟基 -->
        <div class="card">
            <h2>任务2: 炔烃增碳+变醇</h2>
            <div class="svg-container">
                <svg id="svg-s2" width="680" height="150" viewBox="0 0 680 150">
                    <g id="s2-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="bold">4C炔 →
                            6C醇</text>
                        <text x="40" y="80" fill="#1e293b" font-size="11">1) HBr → 炔变烯(带Br) 2) Et₂CuLi → 增加2C
                            (Gilman偶联)</text>
                        <text x="40" y="105" fill="#1e293b" font-size="11">3) Hg(OAc)₂/H₂O, NaBH₄ → 双键变醇 (羟汞化-还原)</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('s2')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 任务3: 三键变反式二氯 -->
        <div class="card">
            <h2>任务3: 三键→反式二氯</h2>
            <div class="svg-container">
                <svg id="svg-s3" width="680" height="130" viewBox="0 0 680 130">
                    <g id="s3-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="90" rx="10" fill="#fce7f3" stroke="#db2777"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#db2777" font-size="13" font-weight="bold">C≡C →
                            Cl-C-C-Cl (反式)</text>
                        <text x="40" y="80" fill="#1e293b" font-size="11">1) H₂/Lindlar催化剂 → 顺式双键 2) Cl₂ →
                            反式加成得反式二氯</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('s3')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <!-- 任务4: 环氧化 -->
        <div class="card">
            <h2>任务4: 烯烃→环氧化物</h2>
            <div class="svg-container">
                <svg id="svg-s4" width="680" height="120" viewBox="0 0 680 120">
                    <g id="s4-step1" opacity="0">
                        <rect x="20" y="20" width="640" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b"
                            stroke-width="2" />
                        <text x="340" y="50" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">C=C →
                            三元环氧 (C-O-C)</text>
                        <text x="340" y="80" text-anchor="middle" fill="#1e293b" font-size="12">试剂: <tspan
                                font-weight="bold">mCPBA</tspan> (间氯过氧苯甲酸) - 一步完成</text>
                    </g>
                </svg>
                <div class="controls">
                    <button class="btn" onclick="toggleAnim('s4')">▶️ 显示</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 关键试剂速记</h2>
            <div class="answer-box">
                <p><strong>O₃ + Zn:</strong> 切断双键变醛/酮</p>
                <p><strong>Lindlar:</strong> 炔→顺式烯 (中毒催化剂)</p>
                <p><strong>Na/NH₃:</strong> 炔→反式烯 (金属还原)</p>
                <p><strong>Gilman R₂CuLi:</strong> 偶联增碳</p>
                <p><strong>mCPBA:</strong> 双键→环氧</p>
                <p><strong>羟汞化:</strong> Hg(OAc)₂/H₂O → NaBH₄ (马氏加OH)</p>
            </div>
        </div>
    </div>

    <script>
        function toggleAnim(id) {
            const el = document.getElementById(`${id}-step1`);
            if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = el.style.opacity === '1' ? '0' : '1'; }
        }
    </script>
</body>

</html>
