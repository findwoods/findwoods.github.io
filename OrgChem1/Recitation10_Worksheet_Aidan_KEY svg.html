            <h4>1. 切断法 (Disconnection)</h4>
            <ul>
                <li>目标分子包含两个部分：一个六元环双键，一个异丁基链。</li>
                <li>最佳切断位置是连接链与环的那个 C-C 单键。</li>
                <li>这将分子分为：<span class="highlight">环己烯基片段</span> + <span class="highlight">异丁基片段</span>。</li>
            </ul>
            <h4>2. 试剂指派</h4>
            <ul>
                <li>我们需要一个做亲电体 (卤代烃)，一个做亲核体 (有机金属)。</li>
                <li><strong>亲电体:</strong> 3-溴环己烯。这很容易通过 <span class="chem-formula">Cyclohexene + NBS</span> 制备 (见 Q1)。</li>
                <li><strong>亲核体:</strong> 异丁基 Gilman 试剂 (<span class="chem-formula">iBu_2CuLi</span>)。</li>
            </ul>
            <h4>3. 为什么选 Gilman?</h4>
            <ul>
                <li>Grignard 试剂与烯丙位卤代烃反应容易发生 <span class="chem-formula">S_N2'</span> 副反应或 Wurtz 偶联副反应。</li>
                <li>Gilman 试剂 (二烃基铜锂) 对卤代烷/烯丙位卤代烷的取代反应专一性高，产率好。</li>

            <h4>2. 原理推导 (pK_a 对比)</h4>
            <ul>
                <li>Grignard 试剂 (<span class="chem-formula">R-MgBr</span>) 本质上是碳负离子，是<strong>极强的碱</strong> (对应共轭酸烷烃 $pK_a \approx 50$)。</li>
                <li>醇 (<span class="chem-formula">R-OH</span>) 是弱酸 ($pK_a \approx 16-18$)。</li>
                <li><strong>酸碱中和反应</strong>的速率远快于任何取代反应 ($S_N2$)。</li>
                <li>一旦形成 Grignard，它会立刻夺取自己分子内或邻近分子的 -OH 质子。</li>

/* ==========================================================================
   APP LOGIC
   ========================================================================== */
const app = {
    currentQ: null,
    stepIndex: 0,
    timer: null,

    init() {
        const navList = document.getElementById('navList');
        Object.keys(DATA).forEach((key, index) => {
            const item = document.createElement('div');
            item.className = 'nav-item';
            item.innerText = DATA[key].title;
            item.onclick = () => this.loadQ(key);
            if (index === 0) this.currentQ = key; // Default
            navList.appendChild(item);
        });
        this.loadQ(this.currentQ);
    },

    loadQ(key) {
        this.currentQ = key;
        this.stepIndex = 0;
        this.stopPlay();

        // Update UI Text
        document.getElementById('qTitle').innerText = DATA[key].title;
        document.getElementById('qSubtitle').innerText = DATA[key].subtitle;
        document.getElementById('derivationContent').innerHTML = DATA[key].derivation;
        
        // Update Nav Active State
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.classList.toggle('active', item.innerText === DATA[key].title);
        });

        this.render();
    },

    render() {
        const data = DATA[this.currentQ];
        const step = data.steps[this.stepIndex];
        const svg = document.getElementById('scene');
        
        document.getElementById('stepInfo').innerText = `步骤 ${this.stepIndex + 1} / ${data.steps.length}: ${step.desc}`;

        // Clear SVG (Simple re-draw strategy)
        svg.innerHTML = '';

        // Draw Bonds
        if (step.bonds) {
            step.bonds.forEach(b => {
                const u = step.atoms.find(a => a.id === b.u);
                const v = step.atoms.find(a => a.id === b.v);
                if (u && v) {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    let d = `M ${u.x} ${u.y} L ${v.x} ${v.y}`;
                    
                    if (b.double) {
                        // Draw background thick line
                        const bg = path.cloneNode();
                        bg.setAttribute("d", d);
                        bg.setAttribute("class", "bond double");
                        svg.appendChild(bg);
                        // Draw foreground thin line
                        const fg = path.cloneNode();
                        fg.setAttribute("d", d);
                        fg.setAttribute("class", "bond double-inner");
                        svg.appendChild(fg);
                    } else {
                        path.setAttribute("d", d);
                        path.setAttribute("class", "bond" + (b.dashed ? " dashed" : ""));
                        svg.appendChild(path);
                    }
                }
            });
        }

        // Draw Arrows
        if (step.arrows) {
            step.arrows.forEach(arr => {
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("d", arr.d);
                p.setAttribute("class", "electron-arrow");
                if(arr.color) p.setAttribute("stroke", arr.color);
                svg.appendChild(p);
            });
        }

        // Draw Atoms
        step.atoms.forEach(a => {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "atom-group");
            g.setAttribute("transform", `translate(${a.x},${a.y})`);
            
            // Circle
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("r", 28);
            c.setAttribute("class", "atom-circle");
            // Fill mapping
            let fillUrl = "#gradC";
            if(a.el === "H") fillUrl = "#gradH";
            if(a.el === "Br") fillUrl = "#gradBr";
            if(a.el === "Mg") fillUrl = "#gradMg";
            if(a.el === "Li") fillUrl = "#gradLi";
            if(a.el === "Cu") fillUrl = "#gradCu";
            if(a.el === "O") fillUrl = "#gradO";
            if(a.el === "Cl") fillUrl = "#gradCl";
            c.setAttribute("fill", `url(${fillUrl})`);
            c.setAttribute("filter", "url(#dropShadow)");
            
            // Label
            const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t.setAttribute("class", "atom-label");
            t.setAttribute("fill", (a.el === "H" || a.el === "Li") ? "#333" : "#fff"); // Contrast text
            t.textContent = a.label || a.el;

            g.appendChild(c);
            g.appendChild(t);
            svg.appendChild(g);
        });

        // Draw Extra Text
        if(step.text) {
            const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txt.setAttribute("x", 400);
            txt.setAttribute("y", 400);
            txt.setAttribute("text-anchor", "middle");
            txt.setAttribute("font-size", "18");
            txt.setAttribute("fill", "#555");
            txt.setAttribute("font-weight", "bold");
            txt.textContent = step.text;
            svg.appendChild(txt);
        }
    },

    next() {
        const max = DATA[this.currentQ].steps.length - 1;
        if (this.stepIndex < max) {
            this.stepIndex++;
            this.render();
        } else {
            this.stopPlay();
        }
    },

    prev() {
        if (this.stepIndex > 0) {
            this.stepIndex--;
            this.render();
        }
    },

    reset() {
        this.stepIndex = 0;
        this.stopPlay();
        this.render();
    },

    togglePlay() {
        const btn = document.getElementById('playBtn');
        if (this.timer) {
            this.stopPlay();
        } else {
            btn.innerHTML = "❚❚ 暂停";
            btn.style.background = "#e74c3c";
            if (this.stepIndex === DATA[this.currentQ].steps.length - 1) this.stepIndex = 0;
            this.render();
            this.timer = setInterval(() => this.next(), 2500);
        }
    },

    stopPlay() {
        clearInterval(this.timer);
        this.timer = null;
        const btn = document.getElementById('playBtn');
        btn.innerHTML = "▶ 播放演示";
        btn.style.background = ""; // reset to css default
    }
};

// Boot
app.init();
</script>
