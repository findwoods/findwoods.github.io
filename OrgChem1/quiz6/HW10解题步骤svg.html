// 辅助：创建正多边形坐标
function getPoly(cx, cy, r, sides, rotation=0) {
    let pts = [];
    for(let i=0; i<sides; i++) {
        let ang = (i * 2 * Math.PI / sides) + rotation;
        pts.push({x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang)});
    }
    return pts;
}

// ================= 应用逻辑 =================

const App = {
    currentQ: "Q1",
    stepIndex: 0,
    timer: null,

    init() {
        this.renderSidebar();
        this.loadQuestion("Q1");
    },

    renderSidebar() {
        const sb = document.getElementById('sidebar');
        Object.keys(QUESTIONS).forEach(key => {
            const item = document.createElement('div');
            item.className = 'nav-item';
            if (key === "Q1") item.classList.add('active');
            item.innerText = QUESTIONS[key].title.split(":")[0];
            item.dataset.key = key;
            item.onclick = () => this.loadQuestion(key);
            sb.appendChild(item);
        });
    },

    loadQuestion(key) {
        this.stopPlay();
        this.currentQ = key;
        this.stepIndex = 0;

        // 更新 UI 文本
        const q = QUESTIONS[key];
        document.getElementById('qTitle').innerText = q.title;
        document.getElementById('qDesc').innerHTML = q.desc;
        document.getElementById('qAnswer').innerText = q.answer;
        
        // 更新侧边栏高亮
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.key === key);
        });

        this.renderStep();
    },

    renderStep() {
        const q = QUESTIONS[this.currentQ];
        const step = q.steps[this.stepIndex];
        const svg = document.getElementById('sceneGroup');

        // 更新步骤文本
        document.getElementById('stepInfo').innerHTML = 
            `<strong>步骤 ${this.stepIndex + 1}/${q.steps.length}:</strong><br>${step.text}`;

        // 清空画布
        svg.innerHTML = '';

        // 1. 绘制键
        if (step.bonds) {
            step.bonds.forEach(b => {
                const a1 = step.atoms.find(a => a.id === b.s);
                const a2 = step.atoms.find(a => a.id === b.e);
                if (a1 && a2) {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    let d = `M ${a1.x} ${a1.y} L ${a2.x} ${a2.y}`;
                    
                    // 双键处理
                    if (b.type === "double") {
                        const dx = a2.x - a1.x;
                        const dy = a2.y - a1.y;
                        const len = Math.sqrt(dx*dx + dy*dy);
                        const ox = (dy/len) * 6; 
                        const oy = (-dx/len) * 6;
                        d = `M ${a1.x+ox} ${a1.y+oy} L ${a2.x+ox} ${a2.y+oy} M ${a1.x-ox} ${a1.y-oy} L ${a2.x-ox} ${a2.y-oy}`;
                        path.classList.add('double');
                    }

                    path.setAttribute("d", d);
                    path.setAttribute("class", "bond" + (b.dashed ? " dashed" : ""));
                    svg.appendChild(path);
                }
            });
        }

        // 2. 绘制电子箭头
        if (step.arrows) {
            step.arrows.forEach(arr => {
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("d", arr.path);
                p.setAttribute("class", "electron-arrow");
                svg.appendChild(p);
            });
        }

        // 3. 绘制原子
        step.atoms.forEach(a => {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("transform", `translate(${a.x}, ${a.y})`);

            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("r", R);
            c.setAttribute("class", "atom-circle");
            c.setAttribute("fill", a.bg || COLORS[a.el] || "#fff");
            c.setAttribute("filter", "url(#dropShadow)");
            if (a.op) c.setAttribute("opacity", a.op);

            const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t.setAttribute("class", "atom-label");
            t.textContent = a.lb;

            g.appendChild(c);
            g.appendChild(t);
            svg.appendChild(g);
        });
    },

    next() {
        const max = QUESTIONS[this.currentQ].steps.length - 1;
        if (this.stepIndex < max) {
            this.stepIndex++;
            this.renderStep();
        } else {
            this.stopPlay();
        }
    },

    prev() {
        if (this.stepIndex > 0) {
            this.stepIndex--;
            this.renderStep();
        }
    },

    reset() {
        this.stopPlay();
        this.stepIndex = 0;
        this.renderStep();
    },

    togglePlay() {
        if (this.timer) {
            this.stopPlay();
        } else {
            const btn = document.getElementById('playBtn');
            btn.innerText = "⏸ 暂停";
            if (this.stepIndex >= QUESTIONS[this.currentQ].steps.length - 1) {
                this.stepIndex = 0;
            }
            this.renderStep();
            this.timer = setInterval(() => this.next(), 2000);
        }
    },

    stopPlay() {
        clearInterval(this.timer);
        this.timer = null;
        document.getElementById('playBtn').innerText = "▶ 播放演示";
    }
};

// 启动
App.init();
