/**
 * 应用逻辑控制器
 */
const app = {
    currentProblemIndex: 0,
    currentStep: 0,
    
    init: function() {
        this.renderSidebar();
        this.loadProblem(0);
    },

    renderSidebar: function() {
        const list = document.getElementById('question-list');
        list.innerHTML = '';
        PROBLEMS.forEach((p, index) => {
            const btn = document.createElement('button');
            btn.className = 'q-btn';
            if(index === 0) btn.classList.add('active');
            btn.innerText = p.title;
            btn.onclick = () => {
                document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.loadProblem(index);
            };
            list.appendChild(btn);
        });
    },

    loadProblem: function(index) {
        this.currentProblemIndex = index;
        this.currentStep = 0;
        this.updateDisplay();
    },

    nextStep: function() {
        const p = PROBLEMS[this.currentProblemIndex];
        if (this.currentStep < p.steps.length - 1) {
            this.currentStep++;
            this.updateDisplay();
        } else {
            // Loop
            this.currentStep = 0;
            this.updateDisplay();
        }
    },

    prevStep: function() {
        if (this.currentStep > 0) {
            this.currentStep--;
            this.updateDisplay();
        }
    },

    reset: function() {
        this.currentStep = 0;
        this.updateDisplay();
    },

    updateDisplay: function() {
        const p = PROBLEMS[this.currentProblemIndex];
        const step = p.steps[this.currentStep];

        // Text
        const textBox = document.getElementById('explanation-text');
        textBox.innerHTML = `<div class="step-indicator">Step ${this.currentStep + 1}/${p.steps.length}</div>` + step.text;

        // Counter
        document.getElementById('step-counter').innerText = `Step ${this.currentStep + 1}/${p.steps.length}`;

        // SVG Rendering
        this.renderSVG(step);
    },

    renderSVG: function(stepData) {
        const container = document.getElementById('scene-group');
        container.innerHTML = ''; // Clear previous

        // Draw Bonds
        if (stepData.bonds) {
            stepData.bonds.forEach(bond => {
                const a1 = stepData.atoms.find(a => a.id === bond[0]);
                const a2 = stepData.atoms.find(a => a.id === bond[1]);
                if (a1 && a2) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", a1.x);
                    line.setAttribute("y1", a1.y);
                    line.setAttribute("x2", a2.x);
                    line.setAttribute("y2", a2.y);
                    line.setAttribute("class", "bond");
                    line.setAttribute("stroke", "#555");
                    
                    if (bond[2]) { // Dashed (Transition/Partial)
                        line.setAttribute("stroke-dasharray", "5,5");
                    }
                    if (bond[3] === 'double') {
                        line.setAttribute("stroke-width", "10");
                        line.setAttribute("stroke", "#333");
                        // Draw a white line inside to simulate double bond visually
                        const inner = line.cloneNode();
                        inner.setAttribute("stroke", "white");
                        inner.setAttribute("stroke-width", "2");
                        container.appendChild(line);
                        container.appendChild(inner);
                        return; 
                    }
                    container.appendChild(line);
                }
            });
        }

        // Draw Atoms
        if (stepData.atoms) {
            stepData.atoms.forEach(atom => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "atom");
                
                const r = atom.r || ATOM_RADIUS;
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", atom.x);
                circle.setAttribute("cy", atom.y);
                circle.setAttribute("r", r);
                circle.setAttribute("fill", ATOM_COLORS[atom.el] || '#999');
                circle.setAttribute("stroke", "#fff");
                circle.setAttribute("stroke-width", "2");
                circle.setAttribute("filter", "url(#shadow)");
                
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", atom.x);
                text.setAttribute("y", atom.y);
                text.setAttribute("class", "atom-label");
                text.setAttribute("font-size", r * 0.6); // Scale font with radius
                text.textContent = atom.label || atom.el;

                g.appendChild(circle);
                g.appendChild(text);
                container.appendChild(g);
            });
        }

        // Draw Arrows
        if (stepData.arrows) {
            stepData.arrows.forEach(arr => {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", arr.path);
                path.setAttribute("class", "electron-arrow visible");
                if(arr.color) path.setAttribute("stroke", arr.color);
                container.appendChild(path);
            });
        }
    }
};

app.init();
