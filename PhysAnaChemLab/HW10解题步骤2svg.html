    return el;
}

            {

/* ================= 渲染逻辑 ================= */

class Visualizer {
    constructor(containerId, data) {
        this.container = document.getElementById(containerId);
        this.data = data;
        this.currentTabIdx = 0;
        this.currentStepIdx = 0;
        this.render();
    }

    render() {
        const html = `
            <div class="problem-card">
                <div class="card-header">
                    <span class="card-title">${this.data.title}</span>
                    <span class="card-tag">${this.data.tag}</span>
                </div>
                <div class="tabs">
                    ${this.data.tabs.map((t, i) => `
                        <button class="tab-btn ${i===0?'active':''}" onclick="instances['${this.data.id}'].switchTab(${i}, this)">
                            ${t.name}
                        </button>
                    `).join('')}
                </div>
                <div class="viz-stage">
                    <svg id="svg-${this.data.id}" viewBox="0 0 800 450"></svg>
                </div>
                <div class="explainer">
                    <span class="step-badge" id="badge-${this.data.id}">Step 1</span>
                    <div class="step-text" id="text-${this.data.id}"></div>
                </div>
                <div class="controls">
                    <button class="btn btn-reset" onclick="instances['${this.data.id}'].reset()">↺ 重置</button>
                    <button class="btn btn-next" onclick="instances['${this.data.id}'].next()">▶ 下一步</button>
                </div>
            </div>
        `;
        this.container.innerHTML = html;
        this.updateScene();
    }

    switchTab(idx, btn) {
        this.currentTabIdx = idx;
        this.currentStepIdx = 0;
        const parent = btn.parentElement;
        [...parent.children].forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        this.updateScene();
    }

    next() {
        const steps = this.data.tabs[this.currentTabIdx].steps;
        if (this.currentStepIdx < steps.length - 1) {
            this.currentStepIdx++;
        } else {
            this.currentStepIdx = 0; 
        }
        this.updateScene();
    }

    reset() {
        this.currentStepIdx = 0;
        this.updateScene();
    }

    updateScene() {
        const step = this.data.tabs[this.currentTabIdx].steps[this.currentStepIdx];
        const total = this.data.tabs[this.currentTabIdx].steps.length;
        const svg = document.getElementById(`svg-${this.data.id}`);

        document.getElementById(`badge-${this.data.id}`).innerText = `Step ${this.currentStepIdx + 1} / ${total}`;
        document.getElementById(`text-${this.data.id}`).innerText = step.text;

        // 绘制键
        let bondGroup = svg.querySelector('.bond-layer');
        if (!bondGroup) {
            bondGroup = createSVG('g', {'class': 'bond-layer'});
            svg.appendChild(bondGroup);
        }
        bondGroup.innerHTML = ''; 
        
        if(step.bonds) {
            step.bonds.forEach(b => {
                const a1 = step.atoms.find(a => a.id === b[0]);
                const a2 = step.atoms.find(a => a.id === b[1]);
                if(a1 && a2) {
                    const line = createSVG('line', {
                        x1: a1.x, y1: a1.y, x2: a2.x, y2: a2.y,
                        class: `bond ${b.length>2 && b[2]===2 ? 'bond-double' : ''}`
                    });
                    if(b[2] === 3) { // Arrow visualization
                        line.setAttribute('marker-end', 'url(#arrow)');
                        line.style.stroke = '#7f8c8d';
                        line.style.strokeWidth = '4px';
                    }
                    bondGroup.appendChild(line);
                }
            });
        }

        // 绘制原子
        let atomGroup = svg.querySelector('.atom-layer');
        if (!atomGroup) {
            atomGroup = createSVG('g', {'class': 'atom-layer'});
            svg.appendChild(atomGroup);
        }

        step.atoms.forEach(atom => {
            let el = document.getElementById(`${this.data.id}-a-${atom.id}`);
            if (!el) {
                el = createSVG('g', {
                    id: `${this.data.id}-a-${atom.id}`,
                    class: 'atom-group'
                });
                
                const circle = createSVG('circle', {r: ATOM_R, class: 'atom-circle'});
                const text = createSVG('text', {class: 'atom-text'});
                
                el.appendChild(circle);
                el.appendChild(text);
                atomGroup.appendChild(el);
            }

            el.style.transform = `translate(${atom.x}px, ${atom.y}px)`;
            el.style.opacity = (atom.o !== undefined) ? atom.o : 1;

            const circle = el.querySelector('circle');
            circle.style.fill = COLORS[atom.e] || '#999';
            
            const text = el.querySelector('text');
            text.textContent = atom.l || atom.e;
        });
        
        // 清理原子
        [...atomGroup.children].forEach(el => {
            const id = parseInt(el.id.split('-a-')[1]);
            if(!step.atoms.find(a => a.id === id)) {
                el.style.opacity = 0;
            }
        });
    }
}

// 初始化
const instances = {};
const app = document.getElementById('app');

QUESTIONS.forEach(q => {
    const div = document.createElement('div');
    div.id = `container-${q.id}`;
    app.appendChild(div);
    instances[q.id] = new Visualizer(div.id, q);
});
