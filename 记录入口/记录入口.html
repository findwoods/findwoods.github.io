<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2b2b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Thinks.log</title>
    
    <!-- 1. 加载 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 加载 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. 加载 Babel (用于解析 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. 加载 KaTeX (数学公式) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        /* 全局样式覆盖 */
        body { 
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif !important; 
            background-color: #2b2b2b;
            -webkit-tap-highlight-color: transparent; /* 移除手机点击高亮 */
        }
        
        /* 极简深色滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2b2b; }
        ::-webkit-scrollbar-thumb { background: #3e3e42; border-radius: 4px; }

        /* KaTeX 颜色覆盖 */
        .katex { color: #9876aa !important; }
        .katex .base { color: #9876aa !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 图标组件 ---
        const Send = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        );
        const Trash2 = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );
        const Clock = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        );
        const Edit2 = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        );

        // --- 经典 Darcula 配色 ---
        const THEME = {
            bg: 'bg-[#2b2b2b]',        // 主背景
            inputBg: 'bg-[#313335]',   // 输入框背景
            text: 'text-[#cdd6f4]',    // 默认字体颜色 (rgb 205,214,244)
            subText: 'text-[#808080]', // 辅助文本
            border: 'border-[#323232]',// 边框
            
            // 语法高亮色值
            colors: {
                heading: 'text-[#89b4fa]', // 淡蓝色 (rgb 137,180,250)
                bold: 'text-[#89b4fa]',    // 淡蓝色 (rgb 137,180,250)
                quote: 'text-[#6a8759]',   // 绿色
                math: 'text-[#9876aa]',    // 紫色
                link: 'text-[#287bde]',    // 蓝色
                button: 'bg-[#4b6eaf] hover:bg-[#3c5a96]', // 按钮蓝
            }
        };

        // --- 内容渲染器 ---
        const ContentRenderer = ({ content }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                const renderMath = () => {
                    if (containerRef.current && window.renderMathInElement) {
                        try {
                            window.renderMathInElement(containerRef.current, {
                                delimiters: [
                                    {left: '$$', right: '$$', display: true},
                                    {left: '$', right: '$', display: false}
                                ],
                                throwOnError: false
                            });
                        } catch (e) { console.error(e); }
                    }
                };
                renderMath();
            }, [content]);

            const processLine = (line, index) => {
                // 标题
                if (line.startsWith('# ')) return <div key={index} className={`${THEME.colors.heading} font-bold text-xl mt-4 mb-2`}>{line.replace('# ', '')}</div>;
                if (line.startsWith('## ')) return <div key={index} className={`${THEME.colors.heading} font-bold text-lg mt-3 mb-2`}>{line.replace('## ', '')}</div>;
                
                // 引用
                if (line.startsWith('> ')) return (
                    <div key={index} className={`${THEME.colors.quote} italic my-2 pl-3 border-l-2 border-[#606366] opacity-90`}>
                        {line.replace('> ', '')}
                    </div>
                );

                // 列表
                if (line.trim().startsWith('- ')) return (
                    <div key={index} className="flex ml-4 my-1">
                        <span className={`${THEME.colors.heading} mr-2`}>•</span>
                        <span>{line.replace('- ', '')}</span>
                    </div>
                );

                if (!line.trim()) return <div key={index} className="h-2"></div>;

                // 行内解析
                const parts = line.split(/(\*\*.*?\*\*|`.*?`)/g);
                return (
                    <div key={index} className="whitespace-pre-wrap break-words leading-relaxed mb-1 text-[15px]">
                        {parts.map((part, i) => {
                            if (part.startsWith('**') && part.endsWith('**')) {
                                return <span key={i} className={`${THEME.colors.bold} font-bold`}>{part.slice(2, -2)}</span>;
                            }
                            if (part.startsWith('`') && part.endsWith('`')) {
                                return <span key={i} className={`bg-[#1e1f22] text-[#a9b7c6] rounded px-1 mx-0.5 border border-[#444] text-sm font-mono`}>{part.slice(1, -1)}</span>;
                            }
                            return <span key={i}>{part}</span>;
                        })}
                    </div>
                );
            };

            return (
                <div ref={containerRef} className="preview-content">
                    {content.split('\n').map((line, i) => processLine(line, i))}
                </div>
            );
        };

        // --- 主应用组件 ---
        function HackerFeedApp() {
            const [posts, setPosts] = useState([]);
            const [inputText, setInputText] = useState("");
            const [isInputExpanded, setIsInputExpanded] = useState(false);
            const inputRef = useRef(null);

            // 初始化
            useEffect(() => {
                const saved = localStorage.getItem('hacker-feed-classic-v2');
                if (saved) {
                    setPosts(JSON.parse(saved));
                } else {
                    // 生成两条初始数据以展示时间轴效果
                    const now = new Date();
                    const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
                    
                    const initPosts = [
                        {
                            id: '2',
                            timestamp: now.toISOString(),
                            content: `# 移动端优化就绪\n\n现在时间轴在手机上也能完美显示了。\n\n- 左侧线条已修复\n- 添加了 PWA 状态栏颜色配置\n`
                        },
                        {
                            id: '1',
                            timestamp: oneHourAgo.toISOString(),
                            content: `# 欢迎归来\n\n这是最经典的版本。没有花里胡哨，只有 **Darcula**。\n\n$$\n\\text{Style} = \\text{Classic}\n$$`
                        }
                    ];
                    setPosts(initPosts);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('hacker-feed-classic-v2', JSON.stringify(posts));
            }, [posts]);

            const handleSubmit = () => {
                if (!inputText.trim()) return;
                
                const newPost = {
                    id: Date.now().toString(),
                    timestamp: new Date().toISOString(),
                    content: inputText
                };
                
                setPosts([newPost, ...posts]);
                setInputText("");
                setIsInputExpanded(false); // 收起
                if (inputRef.current) inputRef.current.blur();
            };

            const handleDelete = (e, id) => {
                e.stopPropagation();
                if (window.confirm("确认删除这条记录？")) {
                    setPosts(prevPosts => prevPosts.filter(p => p.id !== id));
                }
            };

            const formatTime = (isoString) => {
                const date = new Date(isoString);
                return date.toLocaleString('zh-CN', { 
                    month: 'short', 
                    day: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            };

            return (
                <div className={`min-h-screen w-full ${THEME.bg} ${THEME.text} font-sans selection:bg-[#214283]`}>
                    
                    {/* --- 顶部 Header --- */}
                    <div className={`fixed top-0 inset-x-0 h-14 ${THEME.bg} border-b ${THEME.border} z-20 flex items-center justify-center backdrop-blur-sm bg-opacity-95`}>
                        <span className="font-bold text-lg tracking-wide text-[#89b4fa]">Thinks.log</span>
                    </div>

                    {/* --- 主内容区 --- */}
                    <div className="max-w-2xl mx-auto pt-20 pb-10 px-4">
                        
                        {/* 固定的大标题 */}
                        <h2 className="text-xl font-bold text-[#89b4fa] mb-4 pl-1">你在想什么？</h2>

                        {/* --- 输入框区域 --- */}
                        <div className={`
                            mb-8 rounded-lg border ${THEME.border} ${THEME.inputBg} 
                            transition-all duration-300 ease-in-out shadow-lg overflow-hidden
                            ${isInputExpanded ? 'ring-1 ring-[#4b6eaf]' : 'hover:border-[#555]'}
                        `}>
                            <div className="relative">
                                <textarea
                                    ref={inputRef}
                                    className={`
                                        w-full bg-transparent ${THEME.text} p-4 resize-none outline-none text-base leading-relaxed
                                        transition-all duration-300
                                        ${isInputExpanded ? 'h-40' : 'h-14'}
                                    `}
                                    placeholder=""
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    onFocus={() => setIsInputExpanded(true)}
                                />
                                
                                {/* 未展开时的伪装图标 */}
                                {!isInputExpanded && !inputText && (
                                    <div className="absolute right-4 top-4 text-[#808080] pointer-events-none">
                                        <Edit2 size={18} />
                                    </div>
                                )}
                            </div>

                            {/* 底部工具栏 (仅展开时显示) */}
                            <div className={`
                                flex items-center justify-between px-3 py-2 border-t ${THEME.border} bg-[#2b2b2b]
                                transition-all duration-200
                                ${isInputExpanded ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-full h-0 overflow-hidden py-0 border-none'}
                            `}>
                                <div className="flex items-center gap-4 text-xs text-[#808080]">
                                    <span className="hover:text-[#a9b7c6] cursor-pointer">支持 Markdown</span>
                                    <button onClick={() => { setIsInputExpanded(false); }} className="hover:text-[#a9b7c6]">
                                        收起
                                    </button>
                                </div>
                                <button 
                                    onClick={handleSubmit}
                                    disabled={!inputText.trim()}
                                    className={`
                                        px-4 py-1.5 rounded text-sm font-medium text-white flex items-center gap-2 transition-colors
                                        ${inputText.trim() ? THEME.colors.button : 'bg-[#3e3e42] text-[#808080] cursor-not-allowed'}
                                    `}
                                >
                                    <span>发布</span>
                                    <Send size={14} />
                                </button>
                            </div>
                        </div>

                        {/* --- 历史记录列表 --- */}
                        <div className="space-y-6 pl-2 sm:pl-0"> {/* Mobile padding adjustment */}
                            {posts.map((post) => (
                                <div key={post.id} className="group relative">
                                    {/* 左侧时间轴线: 移除了 hidden sm:block，确保手机显示 */}
                                    <div className="absolute left-[-16px] top-4 bottom-[-24px] w-[2px] bg-[#323232] opacity-60"></div>
                                    <div className="absolute left-[-20px] top-4 w-2.5 h-2.5 rounded-full bg-[#323232] border border-[#2b2b2b]"></div>

                                    <div className={`
                                        rounded-lg border ${THEME.border} p-5
                                        transition-colors duration-200 hover:border-[#444]
                                    `}>
                                        {/* 卡片头部信息 */}
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex items-center gap-2 text-xs font-mono text-[#808080]">
                                                <Clock size={12} />
                                                <span>{formatTime(post.timestamp)}</span>
                                            </div>
                                            {/* 删除按钮 */}
                                            <button 
                                                onClick={(e) => handleDelete(e, post.id)}
                                                className="text-[#808080] hover:text-red-400 transition-colors p-2 -mr-2 cursor-pointer"
                                                title="删除"
                                            >
                                                <Trash2 size={14} />
                                            </button>
                                        </div>

                                        {/* 内容渲染 */}
                                        <ContentRenderer content={post.content} />
                                    </div>
                                </div>
                            ))}

                            {posts.length === 0 && (
                                <div className="text-center py-20 text-[#808080]">
                                    <p>这里还什么都没有...</p>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HackerFeedApp />);
    </script>
</body>
</html>
